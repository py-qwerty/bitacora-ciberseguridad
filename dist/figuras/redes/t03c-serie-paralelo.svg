<text class="s" x="460" y="178" text-anchor="middle">externo, de estado</text>
<text class="s" x="380" y="222" text-anchor="middle">Para entrar hay que romper los dos. Conviene que sean distintos (otro fabricante):</text>
<text class="s" x="380" y="242" text-anchor="middle">así un mismo fallo no abre ambos. El externo puede ser de estado: más barato y rápido.</text>
