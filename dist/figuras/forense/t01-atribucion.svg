<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
<defs><marker id="t01at-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker><marker id="t01at-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker><marker id="t01at-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="good" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="h" x="360" y="28" text-anchor="middle">¿Hasta dónde llega la huella digital?</text>
<rect class="c1" x="20" y="70" width="150" height="100" rx="10"/>
<text class="b" x="95" y="107" text-anchor="middle">Acción</text>
<text class="s" x="95" y="125" text-anchor="middle">qué y cómo:</text>
<text class="s" x="95" y="143" text-anchor="middle">logs, archivos</text>
<path class="ln" d="M172 120L196 120" marker-end="url(#t01at-ink)"/>
<rect class="c1" x="198" y="70" width="150" height="100" rx="10"/>
<text class="b" x="273" y="107" text-anchor="middle">Cuenta</text>
<text class="s" x="273" y="125" text-anchor="middle">usuario local</text>
<text class="s" x="273" y="143" text-anchor="middle">o remoto</text>
<path class="ln" d="M350 120L374 120" marker-end="url(#t01at-ink)"/>
<rect class="c1" x="376" y="70" width="150" height="100" rx="10"/>
<text class="b" x="451" y="107" text-anchor="middle">Equipo</text>
<text class="s" x="451" y="125" text-anchor="middle">IP o MAC</text>
<text class="s" x="451" y="143" text-anchor="middle">del dispositivo</text>
<path class="ln" d="M528 120L552 120" marker-end="url(#t01at-ink)"/>
<rect class="c5" x="554" y="70" width="150" height="100" rx="10"/>
<text class="b" x="629" y="107" text-anchor="middle">Persona</text>
<text class="s" x="629" y="125" text-anchor="middle">quién estaba</text>
<text class="s" x="629" y="143" text-anchor="middle">delante</text>
<g><circle class="ink" cx="624" cy="200.8" r="8.8"/><path class="ink" d="M607.5 229.4a16.5 16.5 0 0 1 33 0z"/></g>
<rect class="good" x="20" y="190" width="506" height="40" rx="8" style="opacity:.25"/>
<text class="b" x="273" y="216" text-anchor="middle">Lo que puede probar el análisis forense</text>
<rect class="bad" x="554" y="250" width="146" height="40" rx="8" style="opacity:.25"/>
<text class="b" x="627" y="276" text-anchor="middle">Otras pruebas</text>
<text class="s" x="627" y="310" text-anchor="middle">cámaras, testigos,</text>
<text class="s" x="627" y="328" text-anchor="middle">fichajes, horarios</text>
<text class="s" x="270" y="270" text-anchor="middle">Caso: acceso a nóminas con la cuenta de Ana desde su portátil.</text>
<text class="s" x="270" y="288" text-anchor="middle">Se puede afirmar: «la cuenta y el equipo de Ana».</text>
<text class="s" x="270" y="306" text-anchor="middle">No se puede afirmar sin más pruebas: «lo hizo Ana».</text>
<text class="b" x="270" y="340" text-anchor="middle">El porqué (el motivo) no deja huella digital.</text>
</svg>
