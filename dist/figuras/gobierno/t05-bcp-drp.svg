<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360">
<rect class="c2" x="20" y="30" width="700" height="280" rx="14"/>
<text class="h" x="40" y="62">BCP · plan de continuidad de negocio</text>
<text class="s" x="40" y="86">el «paraguas»: que los procesos críticos de negocio sigan en un tiempo asumible</text>
<rect class="c4" x="40" y="106" width="320" height="184" rx="10"/>
<text class="h" x="200" y="136" text-anchor="middle">DRP</text>
<text class="s" x="200" y="158" text-anchor="middle">recuperación ante desastres</text>
<text x="200" y="186" text-anchor="middle" style="font-size:15px">servicios y aplicaciones</text>
<text x="200" y="204" text-anchor="middle" style="font-size:15px">con soporte tecnológico</text>
<text x="200" y="222" text-anchor="middle" style="font-size:15px"></text>
<text class="s" x="200" y="240" text-anchor="middle">Ej.: levantar servidores en el</text>
<text class="s" x="200" y="258" text-anchor="middle">CPD secundario y restaurar la</text>
<text class="s" x="200" y="276" text-anchor="middle">base de datos replicada</text>
<rect class="c3" x="380" y="106" width="320" height="184" rx="10"/>
<text class="h" x="540" y="136" text-anchor="middle">Gestión de crisis</text>
<text x="540" y="170" text-anchor="middle" style="font-size:15px">quién decide y cómo se comunica</text>
<text x="540" y="190" text-anchor="middle" style="font-size:15px"></text>
<text class="s" x="540" y="210" text-anchor="middle">forma a la Dirección y</text>
<text class="s" x="540" y="230" text-anchor="middle">a los actores clave</text>
<text class="s" x="370" y="338" text-anchor="middle">Ej. de BCP: si cae el sistema, las cajas cobran en papel y la venta online vuelve en 4 horas.</text>
</svg>
