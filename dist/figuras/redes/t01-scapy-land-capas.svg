<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
<defs><marker id="t01sl-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker><marker id="t01sl-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--color-danger)"/></marker><marker id="t01sl-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--color-success)"/></marker></defs>
<text class="h" x="380" y="30" text-anchor="middle">El paquete Land, montado capa a capa con Scapy</text>
<rect class="ink" x="70" y="48" width="620" height="34" rx="6"/>
<text class="w" x="380" y="71" text-anchor="middle" style="font-family:monospace;font-size:15px">Ether() / IP(src=v, dst=v) / TCP(sport=80, dport=80, flags="S")</text>
<rect class="c4" x="20" y="108" width="150" height="96" rx="4"/>
<text class="b" x="95" y="134" text-anchor="middle">① Ethernet</text>
<text class="s" x="95" y="160" text-anchor="middle">valores por</text>
<text class="s" x="95" y="178" text-anchor="middle">defecto</text>
<rect class="c3" x="170" y="108" width="200" height="96" rx="4"/>
<text class="b" x="270" y="134" text-anchor="middle">② IP</text>
<text class="s" x="270" y="160" text-anchor="middle">origen 10.0.0.5</text>
<text class="s" x="270" y="178" text-anchor="middle">destino 10.0.0.5</text>
<rect class="c2" x="370" y="108" width="190" height="96" rx="4"/>
<text class="b" x="465" y="134" text-anchor="middle">③ TCP</text>
<text class="s" x="465" y="160" text-anchor="middle">puerto 80 → 80</text>
<text class="s" x="465" y="178" text-anchor="middle">flags = SYN</text>
<rect class="c1" x="560" y="108" width="180" height="96" rx="4"/>
<text class="b" x="650" y="134" text-anchor="middle">④ Contenido</text>
<text class="s" x="650" y="160" text-anchor="middle">payload (y encima,</text>
<text class="s" x="650" y="178" text-anchor="middle">p. ej., HTTP)</text>
<text class="s" x="380" y="230" text-anchor="middle">La barra «/» de Scapy encapsula: cada capa va metida dentro de la de su izquierda.</text>
<path class="ln" d="M170 254V264H370V254" style="fill:none;stroke-width:3"/>
<text class="b" x="270" y="286" text-anchor="middle" style="fill:var(--color-danger)">Origen = destino</text>
<text class="s" x="270" y="306" text-anchor="middle">= la propia víctima</text>
<path class="ln" d="M370 254V264H560V254" style="fill:none;stroke-width:3"/>
<text class="b" x="465" y="286" text-anchor="middle" style="fill:var(--color-danger)">Mismo puerto</text>
<text class="s" x="465" y="306" text-anchor="middle">en origen y destino</text>
<rect class="tint" x="110" y="330" width="540" height="58" rx="8"/>
<text class="s" x="380" y="354" text-anchor="middle">Parece que el equipo se habla a sí mismo: si no está preparado,</text>
<text class="s" x="380" y="374" text-anchor="middle">entra en bucle. es_land() mira justo estas dos cabeceras.</text>
</svg>
