<rect class="box" x="512" y="150" width="206" height="176" rx="8"/>
<text class="b" x="615" y="174" text-anchor="middle">Capa del SO</text>
<text class="s" x="615" y="192" text-anchor="middle">(sistema operativo)</text>
<text class="s" x="524" y="222">· SYN cache: guarda menos</text>
<text class="s" x="524" y="241">  datos por cada SYN</text>
<text class="s" x="524" y="260">· SYN cookies: no crea el</text>
<text class="s" x="524" y="279">  TCB hasta acabar el saludo</text>
<text class="s" x="370" y="380" text-anchor="middle">Las defensas contra la denegación de servicio se reparten en dos capas:</text>
<text class="s" x="370" y="400" text-anchor="middle">cómo se reparten y limitan las peticiones, y cómo maneja el SO las conexiones TCP.</text>
