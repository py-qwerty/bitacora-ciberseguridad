<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
<defs><marker id="t06vm-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker><marker id="t06vm-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker><marker id="t06vm-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="good" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="h" x="360" y="24" text-anchor="middle">Una máquina virtual: un ordenador dentro de un archivo</text>
<rect class="c4" x="20" y="50" width="680" height="270" rx="14"/>
<text class="b" x="40" y="76">Imagen del equipo anfitrión (Windows)</text>
<text class="s" x="40" y="100">C:\Users\ana\  ·  programas  ·  registro  ·  eventos</text>
<rect class="c3" x="50" y="116" width="620" height="190" rx="12"/>
<text class="b" x="70" y="142">Disco virtual: ana-kali.vmdk (un archivo de 60 GB)</text>
<text class="s" x="70" y="164">se localiza por la app instalada, su configuración y la firma del archivo</text>
<rect class="c1" x="80" y="178" width="560" height="112" rx="10"/>
<text class="b" x="100" y="204">Dentro: otro sistema operativo completo</text>
<g><rect class="box" x="118" y="235" width="44" height="30" rx="3"/><rect class="tint" x="123" y="240" width="34" height="20"/><rect class="ink" x="136" y="265" width="8" height="6"/><rect class="ink" x="126" y="271" width="28" height="4" rx="2"/></g>
<text class="s" x="180" y="240">sus propios usuarios, programas,</text>
<text class="s" x="180" y="260">archivos e historial</text>
<text class="s" x="600" y="250" text-anchor="end">⇒ evidencias</text>
<text class="s" x="600" y="270" text-anchor="end">distintas</text>
<text class="s" x="360" y="352" text-anchor="middle">Formatos: VDI (VirtualBox), VMDK (VMware), VHD/VHDX (Hyper-V), HDD, QCOW.</text>
<text class="s" x="360" y="372" text-anchor="middle">Si no se abre la «casa de muñecas», queda un equipo entero sin registrar.</text>
</svg>
