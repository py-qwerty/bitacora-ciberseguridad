<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
<ellipse class="c4" cx="190" cy="170" rx="180" ry="150"/>
<circle class="c3" cx="190" cy="215" r="78"/>
<text class="b" x="190" y="58" text-anchor="middle">Todos tus datos personales</text>
<text class="s" x="190" y="80" text-anchor="middle">aunque no sean íntimos, o sean públicos</text>
<text class="s" x="110" y="118" text-anchor="middle">tu correo</text>
<text class="s" x="275" y="118" text-anchor="middle">tu nombre</text>
<text class="s" x="95" y="150" text-anchor="middle">tu matrícula</text>
<text class="s" x="290" y="150" text-anchor="middle">tu foto</text>
<text class="b" x="190" y="205" text-anchor="middle">Datos íntimos</text>
<text class="s" x="190" y="227" text-anchor="middle">vida privada</text>
<text class="s" x="190" y="245" text-anchor="middle">y familiar</text>
<rect class="c3" x="405" y="30" width="300" height="130" rx="6"/>
<text class="b" x="555" y="67" text-anchor="middle">Intimidad (art. 18.1 CE)</text>
<text class="s" x="555" y="89" text-anchor="middle">Protege solo lo íntimo.</text>
<text class="s" x="555" y="111" text-anchor="middle">Es reactiva: actúa cuando alguien</text>
<text class="s" x="555" y="133" text-anchor="middle">invade tu vida privada.</text>
<rect class="c4" x="405" y="180" width="300" height="140" rx="6"/>
<text class="b" x="555" y="211" text-anchor="middle">Protección de datos (art. 18.4 CE)</text>
<text class="s" x="555" y="233" text-anchor="middle">Protege cualquier dato personal.</text>
<text class="s" x="555" y="255" text-anchor="middle">Es proactiva: te da el mando sobre</text>
<text class="s" x="555" y="277" text-anchor="middle">qué datos tienen, quién y para qué.</text>
<text class="s" x="555" y="299" text-anchor="middle">Derecho autónomo (STC 292/2000).</text>
</svg>
