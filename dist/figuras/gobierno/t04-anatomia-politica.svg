<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400">
<rect class="box" x="190" y="20" width="360" height="370" rx="10"/>
<path class="tint" d="M500 20h50v50z"/>
<text class="h" x="370" y="52" text-anchor="middle">Política de seguridad</text>
<rect class="c2" x="210" y="70" width="320" height="44" rx="6"/>
<text class="b" x="226" y="90" style="font-size:15px">Propósito</text>
<text class="s" x="226" y="107" style="font-size:13px">por qué existe: qué riesgo mitiga</text>
<rect class="c4" x="210" y="122" width="320" height="44" rx="6"/>
<text class="b" x="226" y="142" style="font-size:15px">Ámbito</text>
<text class="s" x="226" y="159" style="font-size:13px">a qué procesos y personas se aplica</text>
<rect class="c1" x="210" y="174" width="320" height="44" rx="6"/>
<text class="b" x="226" y="194" style="font-size:15px">Descripción</text>
<text class="s" x="226" y="211" style="font-size:13px">qué se exige, cuándo y cómo</text>
<rect class="c3" x="210" y="226" width="320" height="44" rx="6"/>
<text class="b" x="226" y="246" style="font-size:15px">Responsabilidades</text>
<text class="s" x="226" y="263" style="font-size:13px">quién la cumple, expresado en roles</text>
<rect class="box" x="210" y="278" width="320" height="44" rx="6"/>
<text class="b" x="226" y="298" style="font-size:15px">Definiciones y referencias</text>
<text class="s" x="226" y="315" style="font-size:13px">términos y documentos de apoyo</text>
<rect class="box" x="210" y="330" width="320" height="44" rx="6"/>
<text class="b" x="226" y="350" style="font-size:15px">Control de versiones</text>
<text class="s" x="226" y="367" style="font-size:13px">historial de revisiones y fechas</text>
<text class="s" x="370" y="396" text-anchor="middle"></text>
<text class="b" x="95" y="180" text-anchor="middle">Las seis</text>
<text class="b" x="95" y="200" text-anchor="middle">partes de</text>
<text class="b" x="95" y="220" text-anchor="middle">una política</text>
<text class="s" x="95" y="244" text-anchor="middle">(ejemplo SANS)</text>
<text class="s" x="645" y="170" text-anchor="middle">La política fija</text>
<text class="s" x="645" y="188" text-anchor="middle">el objetivo, no</text>
<text class="s" x="645" y="206" text-anchor="middle">el producto:</text>
<text class="s" x="645" y="230" text-anchor="middle">el detalle va en</text>
<text class="s" x="645" y="248" text-anchor="middle">estándares y</text>
<text class="s" x="645" y="266" text-anchor="middle">procedimientos</text>
</svg>
