<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500">
<text class="h" x="180" y="28" text-anchor="middle">Modelo OSI · 7 capas</text>
<text class="h" x="540" y="28" text-anchor="middle">Modelo TCP/IP · 4 capas</text>
<text class="s" x="180" y="46" text-anchor="middle">El modelo teórico de referencia</text>
<text class="s" x="540" y="46" text-anchor="middle">El que usa Internet de verdad</text>
<text class="b" x="22" y="91" text-anchor="middle">7</text>
<rect class="c1" x="40" y="60" width="280" height="52" rx="6"/>
<text class="b" x="180" y="82" text-anchor="middle">Aplicación</text>
<text class="s" x="180" y="100" text-anchor="middle">Servicios de red para las aplicaciones</text>
<text class="b" x="22" y="149" text-anchor="middle">6</text>
<rect class="c1" x="40" y="118" width="280" height="52" rx="6"/>
<text class="b" x="180" y="140" text-anchor="middle">Presentación</text>
<text class="s" x="180" y="158" text-anchor="middle">Cómo se representan los datos</text>
<text class="b" x="22" y="207" text-anchor="middle">5</text>
<rect class="c1" x="40" y="176" width="280" height="52" rx="6"/>
<text class="b" x="180" y="198" text-anchor="middle">Sesión</text>
<text class="s" x="180" y="216" text-anchor="middle">Mantiene el diálogo entre aplicaciones</text>
<text class="b" x="22" y="265" text-anchor="middle">4</text>
<rect class="c2" x="40" y="234" width="280" height="52" rx="6"/>
<text class="b" x="180" y="256" text-anchor="middle">Transporte</text>
<text class="s" x="180" y="274" text-anchor="middle">Extremo a extremo y fiabilidad</text>
<text class="b" x="22" y="323" text-anchor="middle">3</text>
<rect class="c3" x="40" y="292" width="280" height="52" rx="6"/>
<text class="b" x="180" y="314" text-anchor="middle">Red</text>
<text class="s" x="180" y="332" text-anchor="middle">Elige la ruta entre redes</text>
<text class="b" x="22" y="381" text-anchor="middle">2</text>
<rect class="c4" x="40" y="350" width="280" height="52" rx="6"/>
<text class="b" x="180" y="372" text-anchor="middle">Enlace de datos</text>
<text class="s" x="180" y="390" text-anchor="middle">Direcciones físicas (MAC)</text>
<text class="b" x="22" y="439" text-anchor="middle">1</text>
<rect class="c5" x="40" y="408" width="280" height="52" rx="6"/>
<text class="b" x="180" y="430" text-anchor="middle">Física</text>
<text class="s" x="180" y="448" text-anchor="middle">Bits por el cable o el aire</text>
<rect class="band1" x="322" y="60" width="76" height="168"/>
<rect class="c1" x="400" y="60" width="280" height="168" rx="6"/>
<text class="b" x="540" y="132.0" text-anchor="middle">Aplicación</text>
<text class="s" x="540" y="152.0" text-anchor="middle">HTTP, SMTP, DNS, FTP</text>
<text class="s" x="540" y="170.0" text-anchor="middle" font-style="italic">Junta 3 capas de OSI</text>
<rect class="band2" x="322" y="234" width="76" height="52"/>
<rect class="c2" x="400" y="234" width="280" height="52" rx="6"/>
<text class="b" x="540" y="256.0" text-anchor="middle">Transporte</text>
<text class="s" x="540" y="276.0" text-anchor="middle">TCP, UDP</text>
<rect class="band3" x="322" y="292" width="76" height="52"/>
<rect class="c3" x="400" y="292" width="280" height="52" rx="6"/>
<text class="b" x="540" y="314.0" text-anchor="middle">Internet (red)</text>
<text class="s" x="540" y="334.0" text-anchor="middle">IP, ICMP</text>
<rect class="band5" x="322" y="350" width="76" height="110"/>
<rect class="c5" x="400" y="350" width="280" height="110" rx="6"/>
<text class="b" x="540" y="393.0" text-anchor="middle">Acceso a red (física)</text>
<text class="s" x="540" y="413.0" text-anchor="middle">Ethernet, wifi, ARP</text>
<text class="s" x="540" y="431.0" text-anchor="middle" font-style="italic">Junta 2 capas de OSI</text>
<text class="s" x="360" y="492" text-anchor="middle">Las franjas del centro muestran qué capas de OSI agrupa cada capa de TCP/IP.</text>
</svg>