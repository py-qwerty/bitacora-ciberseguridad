<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
<text class="h" x="380" y="24" text-anchor="middle">Paquete con AH (modo transporte)</text>
<path class="ln" d="M40 74V66H720V74"/>
<text class="s" x="380" y="56" text-anchor="middle" style="fill:var(--color-text)"><tspan class="b">Autenticado:</tspan> todo el paquete, salvo campos que cambian por el camino (TTL)</text>
<rect class="box" x="40" y="82" width="180" height="50"/>
<text class="b" x="130.0" y="112.5" text-anchor="middle">Cabecera IP</text>
<rect class="c4" x="220" y="82" width="120" height="50"/>
<text class="b" x="280.0" y="112.5" text-anchor="middle">AH</text>
<rect class="c5" x="340" y="82" width="140" height="50"/>
<text class="b" x="410.0" y="112.5" text-anchor="middle">TCP</text>
<rect class="c1" x="480" y="82" width="240" height="50"/>
<text class="b" x="600.0" y="112.5" text-anchor="middle">Datos</text>
<path class="dash" d="M220 132L160 186M340 132L520 186"/>
<text class="s" x="150" y="220" text-anchor="end">Dentro de AH:</text>
<rect class="c4" x="160" y="186" width="120" height="40"/>
<text class="s" x="220.0" y="211.5" text-anchor="middle">Next Header</text>
<rect class="c4" x="280" y="186" width="120" height="40"/>
<text class="s" x="340.0" y="211.5" text-anchor="middle">Payload Length</text>
<rect class="c4" x="400" y="186" width="120" height="40"/>
<text class="s" x="460.0" y="211.5" text-anchor="middle">Reservado</text>
<rect class="c4" x="160" y="226" width="360" height="40"/>
<text x="340.0" y="251.5" text-anchor="middle">SPI (índice de parámetros de seguridad)</text>
<rect class="c4" x="160" y="266" width="360" height="40"/>
<text x="340.0" y="291.5" text-anchor="middle">Número de secuencia</text>
<rect class="c4" x="160" y="306" width="360" height="50"/>
<text class="b" x="340.0" y="336.5" text-anchor="middle">Datos de autenticación (HMAC)</text>
<path class="ln" d="M526 246H542"/>
<text class="s" x="548" y="251">dice qué SA usar</text>
<path class="ln" d="M526 286H542"/>
<text class="s" x="548" y="291">frena la repetición</text>
<path class="ln" d="M526 331H542"/>
<text class="s" x="548" y="336">el código que se comprueba</text>
<text x="380" y="392" text-anchor="middle">AH <tspan class="b">no cifra</tspan>: cualquiera puede leer TCP y los datos,</text>
<text x="380" y="412" text-anchor="middle">pero si alguien los cambia, el código ya no coincide.</text>
</svg>
