<text class="b" x="660" y="155" text-anchor="middle" style="fill:var(--color-secondary)">Internet</text>
<text class="s" x="380" y="300" text-anchor="middle">Prohibido ir directo de un cortafuegos al otro (✗): todo pasa por el proxy de la DMZ.</text>
<text class="s" x="380" y="324" text-anchor="middle">Para llegar dentro, el atacante tiene que romper los dos cortafuegos.</text>
<text class="b" x="380" y="348" text-anchor="middle" style="font-size:15px">Si fueran de la misma marca, un mismo fallo abriría los dos: por eso, marcas distintas.</text>
