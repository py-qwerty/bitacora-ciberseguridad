<text class="h" x="360" y="24" text-anchor="middle">¿Se ejecutó eraser.exe? Tres fuentes independientes</text>
<rect class="c4" x="20" y="52" width="208" height="170" rx="10"/>
<text class="b" x="124" y="80" text-anchor="middle">Prefetch</text>
<text class="s" x="124" y="104" text-anchor="middle" style="font-size:12px">C:\Windows\Prefetch\</text>
<rect class="box" x="32" y="118" width="184" height="34" rx="4"/>
<text x="124" y="140" text-anchor="middle" style="font-family:Menlo,Consolas,monospace;font-size:14px">ERASER.EXE-1A2B….pf</text>
<text class="s" x="124" y="180" text-anchor="middle">existe → se ejecutó</text>
<path class="ln" d="M124 224L360 282" marker-end="url(#t07tf-ink)"/>
<rect class="c2" x="256" y="52" width="208" height="170" rx="10"/>
<text class="b" x="360" y="80" text-anchor="middle">UserAssist</text>
<text class="s" x="360" y="104" text-anchor="middle" style="font-size:12px">NTUSER.DAT\…\UserAssist\…\Count</text>
<rect class="box" x="268" y="118" width="184" height="34" rx="4"/>
<text x="360" y="140" text-anchor="middle" style="font-family:Menlo,Consolas,monospace;font-size:14px">renfre.rkr (ROT-13)</text>
<text class="s" x="360" y="180" text-anchor="middle">= eraser.exe · 3 veces</text>
<path class="ln" d="M360 224L360 282" marker-end="url(#t07tf-ink)"/>
<rect class="c3" x="492" y="52" width="208" height="170" rx="10"/>
<text class="b" x="596" y="80" text-anchor="middle">RunMRU</text>
<text class="s" x="596" y="104" text-anchor="middle" style="font-size:12px">NTUSER.DAT\…\Explorer\RunMRU</text>
<rect class="box" x="504" y="118" width="184" height="34" rx="4"/>
<text x="596" y="140" text-anchor="middle" style="font-family:Menlo,Consolas,monospace;font-size:14px">eraser</text>
<text class="s" x="596" y="180" text-anchor="middle">escrito en Ejecutar</text>
<path class="ln" d="M596 224L360 282" marker-end="url(#t07tf-ink)"/>
<rect class="good" x="150" y="286" width="420" height="56" rx="10" style="opacity:.25"/>
<text class="b" x="360" y="312" text-anchor="middle">La cuenta del empleado ejecutó el programa</text>
<text class="s" x="360" y="332" text-anchor="middle">(no prueba quién estaba sentado delante)</text>
<text class="s" x="360" y="380" text-anchor="middle">Un solo artefacto puede fallar; varios que coinciden refuerzan la conclusión.</text>
