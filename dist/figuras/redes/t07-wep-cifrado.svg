<path class="ln" d="M150 294V304H360V294" style="stroke:var(--color-text)"/>
<text class="s" x="255" y="326" text-anchor="middle">en claro (4 bytes)</text>
<path class="ln" d="M360 294V304H720V294" style="stroke:var(--color-text)"/>
<text class="s" x="540" y="326" text-anchor="middle">cifrado con RC4</text>
<path class="sbad" d="M50 72V200H205V228" marker-end="url(#t7w-r)" stroke-dasharray="6 5"/>
<text class="s" x="60" y="190">el IV se copia aquí</text>
<rect class="c5" x="20" y="350" width="700" height="96" rx="8"/>
<text class="b" x="40" y="378">Por qué falla:</text>
<text x="40" y="402">• El IV viaja en claro y solo mide 24 bits: acaba repitiéndose.</text>
<text x="40" y="426">• El CRC-32 detecta errores accidentales, no cambios hechos a propósito.</text>
<text class="s" x="370" y="470" text-anchor="middle">Clave de RC4 = IV + clave compartida. ICV = valor de comprobación de integridad.</text>
