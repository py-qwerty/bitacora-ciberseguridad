<rect class="box" x="470" y="88" width="170" height="36" rx="2"/>
<text x="555" y="111.5" text-anchor="middle">Datos</text>
<rect class="c2" x="640" y="88" width="84" height="36" rx="2"/>
<text class="b" x="682" y="111.5" text-anchor="middle">ICV</text>
<path class="ln" d="M530 64V88"/>
<path class="ln" d="M555 124V136H452" marker-end="url(#t7w-a)"/>
<path class="ln" d="M436 149V196" marker-end="url(#t7w-a)"/>
<text class="s" x="446" y="180">XOR</text>
<rect class="box" x="20" y="232" width="130" height="48" rx="2"/>
<text x="85" y="261.5" text-anchor="middle">Cabecera</text>
