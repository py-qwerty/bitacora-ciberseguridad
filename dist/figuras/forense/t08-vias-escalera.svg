<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
<defs><marker id="t08ve-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker><marker id="t08ve-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker><marker id="t08ve-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="good" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="h" x="360" y="24" text-anchor="middle">Seis vías, de más sencilla a más agresiva</text>
<rect class="c1" x="20" y="330" width="680" height="44" rx="6"/>
<text class="b" x="32" y="350">1. Backup del fabricante</text>
<text class="s" x="32" y="368">desbloqueado</text>
<rect class="c1" x="102" y="282" width="598" height="44" rx="6"/>
<text class="b" x="114" y="302">2. Magnet ACQUIRE</text>
<text class="s" x="114" y="320">desbloqueado + depuración USB</text>
<rect class="c1" x="184" y="234" width="516" height="44" rx="6"/>
<text class="b" x="196" y="254">3. Lógica de iOS</text>
<text class="s" x="196" y="272">desbloqueado + confianza PC</text>
<rect class="c3" x="266" y="186" width="434" height="44" rx="6"/>
<text class="b" x="278" y="206">4. ADB</text>
<text class="s" x="278" y="224">depuración USB + root</text>
<rect class="c3" x="348" y="138" width="352" height="44" rx="6"/>
<text class="b" x="360" y="158">5. Custom Recovery</text>
<text class="s" x="360" y="176">bootloader + autorización</text>
<rect class="c5" x="430" y="90" width="270" height="44" rx="6"/>
<text class="b" x="442" y="110">6. JTAG · eMMC · Chip Off</text>
<text class="s" x="442" y="128">microsoldadura + auto judicial</text>
<path class="ln" d="M34 320L34 70" marker-end="url(#t08ve-ink)"/>
<text class="b" x="46" y="72">más agresiva</text>
<text class="s" x="46" y="92">(y más riesgo)</text>
<path class="dash" d="M24 380H700"/>
<text class="b" x="20" y="406">Necesitan el código: 1–3</text>
<text class="b" x="270" y="406">Solo Android, acceso privilegiado: 4–5</text>
<text class="s" x="20" y="428">Más arriba: más información posible, pero más riesgo de alterar o destruir el indicio.</text>
</svg>
