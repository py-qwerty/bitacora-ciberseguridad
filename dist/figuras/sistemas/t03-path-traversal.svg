<path class="path" d="M110 238C78 234 56 208 82 200" marker-end="url(#t03-path-traversal-r)" style="stroke-width:2.5"/>
<circle class="c5" cx="56" cy="218.0" r="10"/>
<text class="b" x="56" y="223.0" text-anchor="middle" style="font-size:13px">3</text>
<path class="path" d="M84 198C52 194 30 88 56 80" marker-end="url(#t03-path-traversal-r)" style="stroke-width:2.5"/>
<circle class="c5" cx="30" cy="138.0" r="10"/>
