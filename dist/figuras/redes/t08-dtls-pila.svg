<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410">
<text class="h" x="180" y="34" text-anchor="middle">TLS</text>
<rect class="c1" x="40" y="54" width="280" height="66" rx="6"/>
<text class="b" x="180" y="82" text-anchor="middle">Aplicación</text>
<text class="s" x="180" y="103" text-anchor="middle">web (HTTPS), correo, FTP</text>
<rect class="ink" x="40" y="126" width="280" height="66" rx="6"/>
<text class="b w" x="180" y="154" text-anchor="middle">TLS</text>
<text class="w" x="180" y="175" text-anchor="middle" style="font-size:14px">cifra, autentica, comprueba integridad</text>
<rect class="c2" x="40" y="198" width="280" height="66" rx="6"/>
<text class="b" x="180" y="226" text-anchor="middle">TCP</text>
<text class="s" x="180" y="247" text-anchor="middle">entrega todo, completo y en orden</text>
<rect class="c3" x="40" y="270" width="280" height="66" rx="6"/>
<text class="b" x="180" y="298" text-anchor="middle">IP</text>
<text class="s" x="180" y="319" text-anchor="middle">red</text>
<text class="h" x="580" y="34" text-anchor="middle">DTLS</text>
<rect class="c1" x="440" y="54" width="280" height="66" rx="6"/>
<text class="b" x="580" y="82" text-anchor="middle">Aplicación</text>
<text class="s" x="580" y="103" text-anchor="middle">videollamada, juegos, voz sobre IP</text>
<rect class="ink" x="440" y="126" width="280" height="66" rx="6"/>
<text class="b w" x="580" y="154" text-anchor="middle">DTLS</text>
<text class="w" x="580" y="175" text-anchor="middle" style="font-size:14px">lo mismo + numera y retransmite</text>
<rect class="c2" x="440" y="198" width="280" height="66" rx="6"/>
<text class="b" x="580" y="226" text-anchor="middle">UDP</text>
<text class="s" x="580" y="247" text-anchor="middle">datagramas sueltos, sin garantías</text>
<rect class="c3" x="440" y="270" width="280" height="66" rx="6"/>
<text class="b" x="580" y="298" text-anchor="middle">IP</text>
<text class="s" x="580" y="319" text-anchor="middle">red</text>
<text x="380" y="370" text-anchor="middle">DTLS da los mismos servicios que TLS, pero <tspan class="b">sobre UDP</tspan>. Como UDP no garantiza</text>
<text x="380" y="392" text-anchor="middle">nada, DTLS añade numeración, ventana antirrepetición y retransmisiones.</text>
</svg>
