<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
<text class="s" x="380" y="26" text-anchor="middle" style="fill:var(--color-text);font-weight:700">arn:partición:servicio:región:cuenta:tipo/recurso</text>
<rect class="box" x="48.0" y="132" width="50" height="40"/>
<text class="b" x="73.0" y="157.5" text-anchor="middle">arn</text>
<path class="ln" d="M73.0 132V110"/>
<text class="b" x="73.0" y="84" text-anchor="middle">prefijo fijo</text>
<text class="s" x="73.0" y="102" text-anchor="middle">siempre «arn»</text>
<text class="b" x="105.0" y="158" text-anchor="middle">:</text>
<rect class="c2" x="112.0" y="132" width="58" height="40"/>
<text class="b" x="141.0" y="157.5" text-anchor="middle">aws</text>
<path class="ln" d="M141.0 172V194"/>
<text class="b" x="141.0" y="212" text-anchor="middle">partición</text>
<text class="s" x="141.0" y="230" text-anchor="middle">grupo de regiones</text>
<text class="b" x="177.0" y="158" text-anchor="middle">:</text>
<rect class="c4" x="184.0" y="132" width="58" height="40"/>
<text class="b" x="213.0" y="157.5" text-anchor="middle">ec2</text>
<path class="ln" d="M213.0 132V110"/>
<text class="b" x="213.0" y="84" text-anchor="middle">servicio</text>
<text class="s" x="213.0" y="102" text-anchor="middle">qué servicio</text>
<text class="b" x="249.0" y="158" text-anchor="middle">:</text>
<rect class="c3" x="256.0" y="132" width="104" height="40"/>
<text class="b" x="308.0" y="157.5" text-anchor="middle">eu-west-1</text>
<path class="ln" d="M308.0 172V194"/>
<text class="b" x="308.0" y="212" text-anchor="middle">región</text>
<text class="s" x="308.0" y="230" text-anchor="middle">dónde está</text>
<text class="b" x="367.0" y="158" text-anchor="middle">:</text>
<rect class="c1" x="374.0" y="132" width="134" height="40"/>
<text class="b" x="441.0" y="157.5" text-anchor="middle">123456789012</text>
<path class="ln" d="M441.0 132V110"/>
<text class="b" x="441.0" y="84" text-anchor="middle">cuenta</text>
<text class="s" x="441.0" y="102" text-anchor="middle">quién es el dueño</text>
<text class="b" x="515.0" y="158" text-anchor="middle">:</text>
<rect class="c5" x="522.0" y="132" width="190" height="40"/>
<text class="b" x="617.0" y="157.5" text-anchor="middle">instance/i-0abc1234</text>
<path class="ln" d="M617.0 172V194"/>
<text class="b" x="617.0" y="212" text-anchor="middle">tipo/recurso</text>
<text class="s" x="617.0" y="230" text-anchor="middle">qué objeto</text>
<path class="dash" d="M30 262H730"/>
<text class="b" x="40" y="292">Algunos campos van vacíos:</text>
<text x="40" y="324"><tspan class="b">arn:aws:iam</tspan><tspan style="fill:var(--color-danger);font-weight:700">::</tspan><tspan class="b">123456789012:user/ana</tspan></text>
<text class="s" x="420" y="324">IAM es global: sin región</text>
<text x="40" y="360"><tspan class="b">arn:aws:s3</tspan><tspan style="fill:var(--color-danger);font-weight:700">:::</tspan><tspan class="b">mi-bucket/fotos/logo.png</tspan></text>
<text class="s" x="420" y="360">S3: sin región ni cuenta</text>
<text class="s" x="380" y="408" text-anchor="middle">Como una dirección postal completa: identifica un solo recurso en todo AWS.</text>
</svg>
