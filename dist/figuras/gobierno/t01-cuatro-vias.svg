<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420">
<rect class="c4" x="20" y="30" width="340" height="170" rx="8"/>
<text class="h" x="40" y="62">Aceptar</text>
<text class="s" x="40" y="88">convivir con él (coste pequeño)</text>
<text class="b" x="40" y="126">Moto:</text>
<text x="96" y="126">Vas en moto y ya.</text>
<text class="b" x="40" y="158">Empresa:</text>
<text class="s" x="40" y="180">Web informativa sin datos sensibles.</text>
<rect class="c1" x="380" y="30" width="340" height="170" rx="8"/>
<text class="h" x="400" y="62">Mitigar</text>
<text class="s" x="400" y="88">controles que bajan probabilidad o impacto</text>
<text class="b" x="400" y="126">Moto:</text>
<text x="456" y="126">Casco y curso de conducción.</text>
<text class="b" x="400" y="158">Empresa:</text>
<text class="s" x="400" y="180">Cambiar contraseñas cada cierto tiempo.</text>
<rect class="c5" x="20" y="220" width="340" height="170" rx="8"/>
<text class="h" x="40" y="252">Evitar</text>
<text class="s" x="40" y="278">dejar la actividad que lo genera</text>
<text class="b" x="40" y="316">Moto:</text>
<text x="96" y="316">Dejas la moto y vas en metro.</text>
<text class="b" x="40" y="348">Empresa:</text>
<text class="s" x="40" y="370">No guardar números de tarjeta.</text>
<rect class="c2" x="380" y="220" width="340" height="170" rx="8"/>
<text class="h" x="400" y="252">Transferir</text>
<text class="s" x="400" y="278">alguien compensa si ocurre</text>
<text class="b" x="400" y="316">Moto:</text>
<text x="456" y="316">Contratas un seguro.</text>
<text class="b" x="400" y="348">Empresa:</text>
<text class="s" x="400" y="370">Ciberseguro: cubre parte de pérdidas.</text>
<text class="s" x="370" y="412" text-anchor="middle">Transferir no elimina la amenaza: solo comparte parte de las consecuencias económicas.</text>
</svg>
