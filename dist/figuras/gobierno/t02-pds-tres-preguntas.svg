<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330">
<defs><marker id="t02pd-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ink" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="c5" x="20" y="60" width="200" height="110" rx="6"/>
<text class="b" x="120" y="102" text-anchor="middle">¿Dónde estamos?</text>
<text class="s" x="120" y="121" text-anchor="middle">estado actual de la</text>
<text class="s" x="120" y="139" text-anchor="middle">seguridad y los riesgos</text>
<rect class="c1" x="520" y="60" width="200" height="110" rx="6"/>
<text class="b" x="620" y="92" text-anchor="middle">¿Dónde queremos</text>
<text class="b" x="620" y="112" text-anchor="middle">llegar?</text>
<text class="s" x="620" y="131" text-anchor="middle">objetivos coherentes,</text>
<text class="s" x="620" y="149" text-anchor="middle">medibles y alcanzables</text>
<rect class="c4" x="270" y="60" width="200" height="110" rx="6"/>
<text class="b" x="370" y="102" text-anchor="middle">¿Cómo llegamos?</text>
<text class="s" x="370" y="121" text-anchor="middle">plan de proyectos</text>
<text class="s" x="370" y="139" text-anchor="middle">priorizado</text>
<path class="ln" d="M224 115L264 115" marker-end="url(#t02pd-a)"/>
<path class="ln" d="M474 115L514 115" marker-end="url(#t02pd-a)"/>
<text class="b" x="370" y="40" text-anchor="middle" style="fill:var(--color-secondary)">Plan Director de Seguridad: 2 a 5 años como máximo</text>
<path class="ln" d="M120 196V230H620V196"/>
<text class="b" x="370" y="252" text-anchor="middle">La distancia entre los dos extremos es el GAP (la brecha):</text>
<text class="s" x="370" y="274" text-anchor="middle">los proyectos del plan sirven para rellenarla.</text>
<text class="s" x="370" y="310" text-anchor="middle">Lo aprueba la Dirección (y pone los recursos) y se revisa al menos una vez al año.</text>
</svg>
