<path class="path" d="M122 76Q250 90 220 152" marker-end="url(#t03-path-traversal-r)" style="stroke-width:2.5"/>
<rect class="c1" x="380" y="60" width="344" height="108" rx="8"/>
<text class="b" x="394" y="84">Uso normal</text>
<text x="394" y="110" font-family="Menlo,Consolas,monospace" style="font-size:14px">?archivo=documentos/reporte.pdf</text>
<text class="s" x="394" y="136">→ /var/www/html/app/</text>
<text class="s" x="394" y="154">   documentos/reporte.pdf</text>
<rect class="c5" x="380" y="182" width="344" height="108" rx="8"/>
<text class="b" x="394" y="206">Ataque</text>
<text x="394" y="232" font-family="Menlo,Consolas,monospace" style="font-size:14px" xml:space="preserve"><tspan>?archivo=</tspan><tspan style="fill:var(--color-danger);font-weight:700">../../../../</tspan><tspan>etc/passwd</tspan></text>
<text class="s" x="394" y="258">4 subidas: app → html → www → var → /</text>
<text class="s" x="394" y="276">→ /etc/passwd, las cuentas de Linux</text>
<rect class="tint" x="380" y="304" width="344" height="124" rx="8"/>
<text class="b" x="394" y="328">Defensa: ruta canónica</text>
<text class="s" x="394" y="352">1. Resolver los ../ → /etc/passwd</text>
<text class="s" x="394" y="374">2. ¿Empieza por /var/www/html/app/?</text>
<text class="s" x="394" y="396">3. No → rechazar la petición</text>
<text class="s" x="394" y="418">Mejor aún: lista blanca de archivos.</text>
</svg>
