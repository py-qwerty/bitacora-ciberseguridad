<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380">
<path class="c2" d="M230 30L230 30L304 126L156 126Z"/>
<text class="b" x="230" y="110" text-anchor="middle">Estratégico</text>
<path class="dash" d="M275 78H450"/>
<text class="b" x="462" y="68">a dónde queremos ir</text>
<text class="s" x="462" y="90">«Vamos a operar en tal mercado»</text>
<text class="b" x="462" y="110" style="fill:var(--color-secondary)">Aquí está el PDS</text>
<path class="c4" d="M153 130L307 130L380 226L80 226Z"/>
<text class="b" x="230" y="176" text-anchor="middle">Táctico</text>
<text class="s" x="230" y="196" text-anchor="middle">qué hay que montar primero</text>
<path class="dash" d="M351 178H450"/>
<text x="462" y="168">«Abrir esta línea de negocio y</text>
<text class="s" x="462" y="190">contactar con estos socios»</text>
<path class="c1" d="M77 230L383 230L457 326L3 326Z"/>
<text class="b" x="230" y="276" text-anchor="middle">Operativo</text>
<text class="s" x="230" y="296" text-anchor="middle">tareas del día a día</text>
<path class="dash" d="M428 278H450"/>
<text x="462" y="268">«Sacar una plataforma nueva,</text>
<text class="s" x="462" y="290">conseguir clientes»</text>
<text class="s" x="230" y="350" text-anchor="middle">de lo general (arriba) a lo concreto (abajo)</text>
</svg>
