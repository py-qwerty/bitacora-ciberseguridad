<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420">
<text class="h" x="130" y="34" text-anchor="middle">Por tipología</text>
<text class="s" x="130" y="56" text-anchor="middle">¿qué tipo de medida?</text>
<rect class="ink" x="20" y="72" width="220" height="40" rx="6"/>
<text class="b w" x="130" y="98" text-anchor="middle">Técnico</text>
<rect class="box" x="20" y="122" width="220" height="40" rx="6"/>
<text x="130" y="148" text-anchor="middle">Físico</text>
<rect class="box" x="20" y="172" width="220" height="40" rx="6"/>
<text x="130" y="198" text-anchor="middle">Administrativo</text>
<text class="h" x="370" y="34" text-anchor="middle">Por objetivo</text>
<text class="s" x="370" y="56" text-anchor="middle">¿qué hace frente al riesgo?</text>
<rect class="ink" x="260" y="72" width="220" height="40" rx="6"/>
<text class="b w" x="370" y="98" text-anchor="middle">Preventivo</text>
<rect class="box" x="260" y="122" width="220" height="40" rx="6"/>
<text x="370" y="148" text-anchor="middle">Disuasorio</text>
<rect class="box" x="260" y="172" width="220" height="40" rx="6"/>
<text x="370" y="198" text-anchor="middle">Detectivo</text>
<rect class="box" x="260" y="222" width="220" height="40" rx="6"/>
<text x="370" y="248" text-anchor="middle">Correctivo</text>
<rect class="box" x="260" y="272" width="220" height="40" rx="6"/>
<text x="370" y="298" text-anchor="middle">Compensatorio</text>
<text class="h" x="610" y="34" text-anchor="middle">Por naturaleza</text>
<text class="s" x="610" y="56" text-anchor="middle">¿quién la impone y cómo?</text>
<rect class="box" x="500" y="72" width="220" height="40" rx="6"/>
<text x="610" y="98" text-anchor="middle">Obligatorio / voluntario</text>
<rect class="ink" x="500" y="122" width="220" height="40" rx="6"/>
<text class="b w" x="610" y="148" text-anchor="middle">Manual / automático</text>
<rect class="tint" x="20" y="350" width="700" height="56" rx="8"/>
<text class="b" x="370" y="374" text-anchor="middle">Un antivirus encaja en las tres a la vez:</text>
<text class="s" x="370" y="396" text-anchor="middle">técnico (tipología) · preventivo (objetivo) · automático (naturaleza)</text>
</svg>
