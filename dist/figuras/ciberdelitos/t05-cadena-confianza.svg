<text class="b" x="360" y="290" text-anchor="middle">Para validar una firma se recorre la cadena hasta la raíz</text>
<text class="s" x="360" y="330" text-anchor="middle">Cada certificado une una identidad con su clave pública y lo firma alguien</text>
<text class="s" x="360" y="350" text-anchor="middle">de más arriba. Nunca contiene la clave privada.</text>
<text class="s" x="360" y="380" text-anchor="middle">Ejemplo español de prestador: CERES, de la FNMT-RCM.</text>
