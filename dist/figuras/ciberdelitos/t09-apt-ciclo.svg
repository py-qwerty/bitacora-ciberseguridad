<text class="s" x="144" y="196" style="fill:var(--color-primary)">vuelve a empezar</text>
<rect class="c4" x="30" y="23" width="200" height="54" rx="6"/>
<text class="b" x="130" y="45.5" text-anchor="middle">1. Reconocimiento</text>
<text class="s" x="130" y="64.5" text-anchor="middle">elige a sus víctimas</text>
<rect class="c4" x="260" y="23" width="200" height="54" rx="6"/>
<text class="b" x="360" y="45.5" text-anchor="middle">2. Intrusión inicial</text>
<text class="s" x="360" y="64.5" text-anchor="middle">spear phishing</text>
<rect class="c4" x="490" y="23" width="200" height="54" rx="6"/>
<text class="b" x="590" y="45.5" text-anchor="middle">3. Puerta trasera</text>
<text class="s" x="590" y="64.5" text-anchor="middle">conecta con el C&amp;C</text>
<rect class="c3" x="490" y="163" width="200" height="54" rx="6"/>
<text class="b" x="590" y="185.5" text-anchor="middle">4. Roba credenciales</text>
<text class="s" x="590" y="204.5" text-anchor="middle">identidades legítimas</text>
<rect class="c3" x="490" y="303" width="200" height="54" rx="6"/>
<text class="b" x="590" y="325.5" text-anchor="middle">5. Instala utilidades</text>
<text class="s" x="590" y="344.5" text-anchor="middle">sniffers, keyloggers</text>
<rect class="c3" x="260" y="303" width="200" height="54" rx="6"/>
<text class="b" x="360" y="325.5" text-anchor="middle">6. Se extiende</text>
<text class="s" x="360" y="344.5" text-anchor="middle">y extrae los datos</text>
<rect class="c5" x="30" y="303" width="200" height="54" rx="6"/>
<text class="b" x="130" y="325.5" text-anchor="middle">7. Persistencia</text>
<text class="s" x="130" y="344.5" text-anchor="middle">muta y abre accesos</text>
<text class="h" x="390" y="176" text-anchor="middle">APT</text>
<text class="s" x="390" y="202" text-anchor="middle">no es una lista que se recorre</text>
<text class="s" x="390" y="220" text-anchor="middle">una vez: es un ciclo para</text>
<text class="s" x="390" y="238" text-anchor="middle">entrar sin ruido y quedarse</text>
