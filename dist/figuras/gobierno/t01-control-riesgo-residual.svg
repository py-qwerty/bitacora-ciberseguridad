<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380">
<defs><marker id="t01cr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path style="fill:var(--color-secondary)" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="h" x="110" y="40" text-anchor="middle">Riesgo inicial</text>
<text class="h" x="630" y="40" text-anchor="middle">Riesgo residual</text>
<rect class="c5" x="60" y="80" width="100" height="240" rx="4"/>
<text class="b" x="110" y="206" text-anchor="middle">alto</text>
<rect class="c3" x="580" y="230" width="100" height="90" rx="4"/>
<text class="b" x="630" y="282" text-anchor="middle">menor</text>
<path class="ln" d="M40 320H700" style="stroke:var(--color-muted)"/>
<rect class="c1" x="250" y="70" width="240" height="96" rx="6"/>
<text class="b" x="370" y="105" text-anchor="middle">Baja la probabilidad</text>
<text class="s" x="370" y="124" text-anchor="middle">que no ocurra</text>
<text class="s" x="370" y="142" text-anchor="middle">(como los frenos ABS)</text>
<rect class="c4" x="250" y="190" width="240" height="96" rx="6"/>
<text class="b" x="370" y="225" text-anchor="middle">Limita el impacto</text>
<text class="s" x="370" y="244" text-anchor="middle">que haga menos daño</text>
<text class="s" x="370" y="262" text-anchor="middle">(como el cinturón)</text>
<text class="s" x="370" y="58" text-anchor="middle">Un control hace una de estas dos cosas (o ambas)</text>
<path class="ln" d="M166 190L244 130" marker-end="url(#t01cr-g)"/>
<path class="ln" d="M166 210L244 238" marker-end="url(#t01cr-g)"/>
<path class="ln" d="M496 130L574 262" marker-end="url(#t01cr-g)"/>
<path class="ln" d="M496 238L574 272" marker-end="url(#t01cr-g)"/>
<text class="s" x="370" y="308" text-anchor="middle">Ej.: contraseñas robustas → menos accesos no autorizados</text>
<text class="s" x="630" y="346" text-anchor="middle">nunca llega a cero:</text>
<text class="s" x="630" y="364" text-anchor="middle">phishing, ingeniería social…</text>
<text class="s" x="110" y="346" text-anchor="middle">el control se justifica</text>
<text class="s" x="110" y="364" text-anchor="middle">si reduce un riesgo concreto</text>
<text class="b" x="370" y="364" text-anchor="middle">El residual se evalúa: no se ignora.</text>
</svg>
