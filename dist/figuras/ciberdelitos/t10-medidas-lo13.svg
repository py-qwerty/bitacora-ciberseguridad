<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490">
<defs><marker id="t10medidas-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path style="fill:var(--color-text)" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="c3" x="14" y="14" width="220" height="462" rx="8"/>
<text class="b" x="124" y="44" text-anchor="middle">Solicitud</text>
<text class="s" x="124" y="66" text-anchor="middle">del Fiscal o la Policía Judicial</text>
<text class="b" x="124" y="110" text-anchor="middle">Debe contener:</text>
<text x="32" y="142" style="font-size:15px">• hecho investigado</text>
<text x="32" y="174" style="font-size:15px">• identidad del</text>
<text x="46" y="198" style="font-size:15px">investigado</text>
<text x="32" y="238" style="font-size:15px">• razones que la</text>
<text x="46" y="262" style="font-size:15px">justifican</text>
<text x="32" y="302" style="font-size:15px">• extensión</text>
<text x="32" y="334" style="font-size:15px">• duración</text>
<text x="32" y="366" style="font-size:15px">• forma de ejecución</text>
<text x="32" y="398" style="font-size:15px">• unidad que la hará</text>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M234 225H252" marker-end="url(#t10medidas-k)"/>
<rect class="ink" x="256" y="180" width="150" height="90" rx="6"/>
<text class="w b" x="331" y="210" text-anchor="middle">Juez</text>
<text class="w b" x="331" y="230" text-anchor="middle">resolución</text>
<text class="w b" x="331" y="250" text-anchor="middle">motivada</text>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M406 225L460 87" marker-end="url(#t10medidas-k)"/>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M406 225L460 247" marker-end="url(#t10medidas-k)"/>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M406 225L460 407" marker-end="url(#t10medidas-k)"/>
<text class="b" x="331" y="316" text-anchor="middle">Respeta cuatro</text>
<text class="b" x="331" y="336" text-anchor="middle">principios:</text>
<text class="s" x="331" y="362" text-anchor="middle">especialidad,</text>
<text class="s" x="331" y="380" text-anchor="middle">idoneidad,</text>
<text class="s" x="331" y="398" text-anchor="middle">excepcionalidad</text>
<text class="s" x="331" y="416" text-anchor="middle">y necesidad</text>
<rect class="c4" x="466" y="14" width="244" height="146" rx="8"/>
<text class="b" x="588" y="48" text-anchor="middle">Interceptar comunicaciones</text>
<text x="588" y="84" text-anchor="middle" style="font-size:13.5px">terminales del investigado o de quien</text>
<text x="588" y="104" text-anchor="middle" style="font-size:13.5px">colabora con él; 3 meses, prorrogable</text>
<text x="588" y="124" text-anchor="middle" style="font-size:13.5px">hasta un máximo de 18</text>
<rect class="c2" x="466" y="174" width="244" height="146" rx="8"/>
<text class="b" x="588" y="208" text-anchor="middle">Registro remoto de equipos</text>
<text x="588" y="244" text-anchor="middle" style="font-size:13.5px">solo para ciertos delitos (organización</text>
<text x="588" y="264" text-anchor="middle" style="font-size:13.5px">criminal, terrorismo, menores…); dice</text>
<text x="588" y="284" text-anchor="middle" style="font-size:13.5px">qué equipos y qué software se usan</text>
<rect class="c5" x="466" y="334" width="244" height="146" rx="8"/>
<text class="b" x="588" y="368" text-anchor="middle">Grabar conversaciones</text>
<text x="588" y="404" text-anchor="middle" style="font-size:13.5px">delitos dolosos con pena máxima de al</text>
<text x="588" y="424" text-anchor="middle" style="font-size:13.5px">menos 3 años, organización criminal o</text>
<text x="588" y="444" text-anchor="middle" style="font-size:13.5px">terrorismo; lugar concreto</text>
</svg>
