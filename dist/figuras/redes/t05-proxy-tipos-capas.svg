<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480">
<defs><marker id="t05pt-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker><marker id="t05pt-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--color-danger)"/></marker><marker id="t05pt-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--color-success)"/></marker></defs>
<text class="h" x="150" y="30" text-anchor="middle">Pila TCP/IP</text>
<text class="h" x="520" y="30" text-anchor="middle">Cuánto entiende cada tipo de proxy</text>
<rect class="c1" x="30" y="60" width="240" height="80" rx="5"/>
<text class="b" x="150" y="98" text-anchor="middle">Aplicación</text>
<text class="s" x="150" y="116" text-anchor="middle">HTTP, DNS, FTP</text>
<rect class="c2" x="30" y="148" width="240" height="80" rx="5"/>
<text class="b" x="150" y="186" text-anchor="middle">Transporte</text>
<text class="s" x="150" y="204" text-anchor="middle">TCP, UDP · puertos</text>
<rect class="c3" x="30" y="236" width="240" height="80" rx="5"/>
<text class="b" x="150" y="274" text-anchor="middle">Internet (red)</text>
<text class="s" x="150" y="292" text-anchor="middle">IP · direcciones</text>
<rect class="c4" x="30" y="324" width="240" height="80" rx="5"/>
<text class="b" x="150" y="362" text-anchor="middle">Acceso a la red</text>
<text class="s" x="150" y="380" text-anchor="middle">Ethernet, wifi · MAC</text>
<text class="s" x="262" y="80" text-anchor="end" font-style="italic">OSI 5-7</text>
<path class="dash" d="M272 100.0H296"/>
<text class="s" x="262" y="168" text-anchor="end" font-style="italic">OSI 4</text>
<path class="dash" d="M272 188.0H296"/>
<text class="s" x="262" y="256" text-anchor="end" font-style="italic">OSI 3</text>
<path class="dash" d="M272 276.0H296"/>
<text class="s" x="262" y="344" text-anchor="end" font-style="italic">OSI 1-2</text>
<path class="dash" d="M272 364.0H296"/>
<rect class="c3" x="300" y="148" width="140" height="168" rx="8"/>
<text class="b" x="370" y="196.5" text-anchor="middle">NAT</text>
<text class="s" x="370" y="221.5" text-anchor="middle">traduce</text>
<text class="s" x="370" y="238.5" text-anchor="middle">direcciones IP</text>
<text class="s" x="370" y="255.5" text-anchor="middle">y puertos;</text>
<text class="s" x="370" y="272.5" text-anchor="middle">oculta la red</text>
<rect class="c2" x="450" y="148" width="140" height="80" rx="8"/>
<text class="b" x="520" y="171.5" text-anchor="middle">De circuito</text>
<text class="s" x="520" y="196.5" text-anchor="middle">reenvía TCP/UDP</text>
<text class="s" x="520" y="213.5" text-anchor="middle">sin mirar dentro</text>
<rect class="c1" x="600" y="60" width="140" height="256" rx="8"/>
<text class="b" x="670" y="143" text-anchor="middle">De aplicación</text>
<text class="s" x="670" y="168" text-anchor="middle">entiende un</text>
<text class="s" x="670" y="185" text-anchor="middle">protocolo</text>
<text class="s" x="670" y="202" text-anchor="middle">concreto</text>
<text class="s" x="670" y="219" text-anchor="middle">(p. ej., HTTP)</text>
<text class="s" x="670" y="236" text-anchor="middle">y lo filtra</text>
<rect class="tint" x="30" y="418" width="710" height="54" rx="8"/>
<text class="s" x="385" y="440" text-anchor="middle">Caché, transparente e inverso trabajan con la web; no se distinguen por la capa</text>
<text class="s" x="385" y="458" text-anchor="middle">sino por a quién sirven (empleados que salen o servidores que reciben visitas).</text>
</svg>
