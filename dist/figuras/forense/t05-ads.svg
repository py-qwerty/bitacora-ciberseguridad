<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
<defs><marker id="t05ad-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker><marker id="t05ad-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker><marker id="t05ad-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="good" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="h" x="360" y="24" text-anchor="middle">Un archivo NTFS con una cara oculta</text>
<rect class="box" x="20" y="60" width="220" height="200" rx="10"/>
<g><path class="c4" d="M106 89.6h33.6l14.4 14.4v46.4h-48z"/><path class="ln" d="M115.6 115.2h28.8M115.6 126.4h28.8M115.6 137.6h19.2"/></g>
<text class="b" x="130" y="180" text-anchor="middle">informe.pdf</text>
<text class="s" x="130" y="200" text-anchor="middle">una sola referencia</text>
<text class="s" x="130" y="236" text-anchor="middle">Explorador: 1 MB</text>
<path class="ln" d="M242 120L330 96" marker-end="url(#t05ad-ink)"/>
<path class="ln" d="M242 180L330 206" marker-end="url(#t05ad-ink)"/>
<rect class="c1" x="334" y="64" width="366" height="64" rx="8"/>
<text class="b" x="350" y="90">Flujo principal (mainstream)</text>
<text class="s" x="350" y="112">el PDF que se ve al abrirlo · cuenta en el tamaño</text>
<rect class="c5" x="334" y="172" width="366" height="64" rx="8" style="stroke-dasharray:6 4"/>
<text class="b" x="350" y="198">Flujo alternativo: informe.pdf:oculto.txt</text>
<text class="s" x="350" y="220">no se ve ni cuenta en el tamaño · puede ser un .exe</text>
<text class="b" x="360" y="288" text-anchor="middle">Para verlo: «dir /r» en la consola o AlternateStreamView (NirSoft).</text>
<text class="s" x="360" y="310" text-anchor="middle">Los antivirus antiguos solo leían el flujo principal.</text>
</svg>
