<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
<text class="h" x="360" y="28" text-anchor="middle">Un mismo incidente, tres relojes</text>
<text class="b" x="20" y="98">NIS 2</text>
<text class="s" x="20" y="118">CSIRT o autoridad</text>
<path class="ln" d="M190 100H700"/>
<circle class="ink" cx="190" cy="100" r="6"/>
<text class="b" x="20" y="208">RGPD</text>
<text class="s" x="20" y="228">si hay datos personales</text>
<path class="ln" d="M190 210H700"/>
<circle class="ink" cx="190" cy="210" r="6"/>
<text class="b" x="20" y="308">Directiva CER</text>
<text class="s" x="20" y="328">entidades críticas</text>
<path class="ln" d="M190 310H700"/>
<circle class="ink" cx="190" cy="310" r="6"/>
<circle class="warn" cx="310" cy="100" r="9"/>
<text class="b" x="310" y="82" text-anchor="middle">24 h</text>
<text class="s" x="310" y="130" text-anchor="middle">alerta temprana</text>
<circle class="c3" cx="450" cy="100" r="9"/>
<text class="b" x="450" y="82" text-anchor="middle">72 h</text>
<text class="s" x="450" y="130" text-anchor="middle">notificación</text>
<circle class="c1" cx="620" cy="100" r="9"/>
<text class="b" x="620" y="82" text-anchor="middle">+1 mes</text>
<text class="s" x="620" y="130" text-anchor="middle">informe final</text>
<text class="s" x="620" y="148" text-anchor="middle">(desde la de 72 h)</text>
<circle class="c3" cx="450" cy="210" r="9"/>
<text class="b" x="450" y="192" text-anchor="middle">72 h</text>
<text class="s" x="450" y="240" text-anchor="middle">aviso a la AEPD</text>
<circle class="warn" cx="310" cy="310" r="9"/>
<text class="b" x="310" y="292" text-anchor="middle">24 h</text>
<text class="s" x="310" y="340" text-anchor="middle">notificación inicial</text>
<circle class="c1" cx="620" cy="310" r="9"/>
<text class="b" x="620" y="292" text-anchor="middle">1 mes</text>
<text class="s" x="620" y="340" text-anchor="middle">informe detallado</text>
<text class="b" x="190" y="382" text-anchor="middle">Constancia</text>
<text class="s" x="190" y="400" text-anchor="middle">del incidente</text>
<text class="s" x="480" y="384" text-anchor="middle">Las normas se suman: notificar a NIS 2</text>
<text class="s" x="480" y="402" text-anchor="middle">no exime de avisar a la AEPD.</text>
</svg>
