<rect class="c3" x="20" y="20" width="120" height="52" rx="4"/>
<text class="b" x="80" y="41.5" text-anchor="middle">IV</text>
<text class="b" x="80" y="61.5" text-anchor="middle">24 bits</text>
<text class="h" x="160" y="52" text-anchor="middle">+</text>
