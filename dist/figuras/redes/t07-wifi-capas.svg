<text class="b" x="382" y="262" text-anchor="middle">802.11 (wifi)</text>
<text class="s" x="382" y="282" text-anchor="middle">ondas de radio</text>
<text class="s" x="382" y="300" text-anchor="middle">igual que 802.3 (Ethernet)</text>
<text class="s" x="382" y="318" text-anchor="middle">por cable</text>
<rect class="ink" x="505" y="236" width="235" height="106" rx="8"/>
<text class="b w" x="622" y="262" text-anchor="middle">WEP · WPA · WPA2 · WPA3</text>
<text class="w" x="622" y="284" text-anchor="middle" style="font-size:14px">cifran las tramas de datos</text>
<text class="w" x="622" y="304" text-anchor="middle" style="font-size:14px">de la wifi (capa de enlace);</text>
<text class="w" x="622" y="324" text-anchor="middle" style="font-size:14px">antes de WPA3, no las de gestión</text>
<text class="b" x="20" y="360">Y en el recorrido:</text>
