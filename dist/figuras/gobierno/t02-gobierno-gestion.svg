<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440">
<defs><marker id="t02gg-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ink" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="c2" x="20" y="20" width="700" height="150" rx="10"/>
<text class="h" x="40" y="50">Gobierno</text>
<text class="s" x="150" y="50">la Dirección: consejo, CEO, directivos</text>
<rect class="box" x="40" y="68" width="206" height="86" rx="6"/>
<text class="b" x="143" y="98" text-anchor="middle">Dirige</text>
<text class="s" x="143" y="117" text-anchor="middle">estrategia y apetito</text>
<text class="s" x="143" y="135" text-anchor="middle">de riesgo</text>
<rect class="box" x="266" y="68" width="206" height="86" rx="6"/>
<text class="b" x="369" y="98" text-anchor="middle">Gestiona riesgos</text>
<text class="s" x="369" y="117" text-anchor="middle">hasta un nivel</text>
<text class="s" x="369" y="135" text-anchor="middle">aceptable (no cero)</text>
<rect class="box" x="492" y="68" width="206" height="86" rx="6"/>
<text class="b" x="595" y="98" text-anchor="middle">Supervisa recursos</text>
<text class="s" x="595" y="117" text-anchor="middle">eficacia y eficiencia</text>
<text class="s" x="595" y="135" text-anchor="middle">de los controles</text>
<rect class="c1" x="20" y="270" width="700" height="120" rx="10"/>
<text class="h" x="40" y="300">Gestión y operación</text>
<text class="s" x="268" y="300">el día a día: implantar y hacer funcionar</text>
<rect class="box" x="40" y="316" width="206" height="56" rx="6"/>
<text class="b" x="143" y="349" text-anchor="middle">Controles</text>
<rect class="box" x="266" y="316" width="206" height="56" rx="6"/>
<text class="b" x="369" y="349" text-anchor="middle">Proyectos</text>
<rect class="box" x="492" y="316" width="206" height="56" rx="6"/>
<text class="b" x="595" y="349" text-anchor="middle">Operación diaria</text>
<path class="ln" d="M250 174L250 264" marker-end="url(#t02gg-a)"/>
<text class="b" x="240" y="212" text-anchor="end">dirige y</text>
<text class="b" x="240" y="232" text-anchor="end">pone recursos</text>
<path class="ln" d="M490 264L490 174" marker-end="url(#t02gg-a)"/>
<text class="b" x="500" y="212">informa con</text>
<text class="b" x="500" y="232">indicadores</text>
<text class="s" x="370" y="416" text-anchor="middle">El gobierno no implanta controles, pero comprueba que funcionan y que el riesgo</text>
<text class="s" x="370" y="434" text-anchor="middle">queda por debajo del apetito de riesgo. Se puede delegar la ejecución, no la responsabilidad.</text>
</svg>
