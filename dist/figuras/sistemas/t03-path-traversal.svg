<text x="204" y="322" font-family="Menlo,Consolas,monospace" style="font-size:15px;font-weight:700">app/</text>
<path class="c1" d="M190 344h11l4 5h17v19h-32z"/>
<text x="230" y="362" font-family="Menlo,Consolas,monospace" style="font-size:15px;font-weight:700">documentos/</text>
<rect class="box" x="220" y="382" width="24" height="28" rx="3"/>
<path class="ln" d="M225 392h14M225 399h14" style="stroke-width:1.5"/>
<text x="256" y="402" font-family="Menlo,Consolas,monospace" style="font-size:15px;font-weight:700">reporte.pdf</text>
