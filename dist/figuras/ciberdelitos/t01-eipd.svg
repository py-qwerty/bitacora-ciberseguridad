<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
<defs><marker id="t01eipd-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="good" d="M0 0L10 5L0 10z"/></marker><marker id="t01eipd-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path style="fill:var(--color-text)" d="M0 0L10 5L0 10z"/></marker><marker id="t01eipd-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="c3" x="20" y="40" width="150" height="110" rx="6"/>
<text class="b" x="95" y="68.5" text-anchor="middle">1. ¿Necesaria y</text>
<text x="95" y="89.5" text-anchor="middle">proporcional?</text>
<text class="s" x="95" y="110.5" text-anchor="middle">¿Hay forma menos</text>
<text class="s" x="95" y="131.5" text-anchor="middle">invasiva?</text>
<rect class="c4" x="195" y="40" width="150" height="110" rx="6"/>
<text class="b" x="270" y="68.5" text-anchor="middle">2. Identificar</text>
<text x="270" y="89.5" text-anchor="middle">los riesgos</text>
<text class="s" x="270" y="110.5" text-anchor="middle">para los derechos y</text>
<text class="s" x="270" y="131.5" text-anchor="middle">libertades</text>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M170 95H193" marker-end="url(#t01eipd-k)"/>
<rect class="c4" x="370" y="40" width="150" height="110" rx="6"/>
<text class="b" x="445" y="68.5" text-anchor="middle">3. Aplicar</text>
<text x="445" y="89.5" text-anchor="middle">medidas</text>
<text class="s" x="445" y="110.5" text-anchor="middle">técnicas y</text>
<text class="s" x="445" y="131.5" text-anchor="middle">organizativas</text>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M345 95H368" marker-end="url(#t01eipd-k)"/>
<rect class="c4" x="545" y="40" width="150" height="110" rx="6"/>
<text class="b" x="620" y="68.5" text-anchor="middle">4. Medir el riesgo</text>
<text x="620" y="89.5" text-anchor="middle">residual</text>
<text class="s" x="620" y="110.5" text-anchor="middle">el que queda tras</text>
<text class="s" x="620" y="131.5" text-anchor="middle">las medidas</text>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M520 95H543" marker-end="url(#t01eipd-k)"/>
<text class="s" x="20" y="26">Una EIPD es un análisis de riesgos «plus»: empieza por la proporcionalidad.</text>
<path class="sbad" d="M95 152V228" marker-end="url(#t01eipd-r)"/>
<text class="b" x="105" y="195">No</text>
<rect class="c5" x="20" y="232" width="150" height="80" rx="6"/>
<text class="b" x="95" y="248.5" text-anchor="middle">No se puede</text>
<text x="95" y="267.5" text-anchor="middle">hacer</text>
<text class="s" x="95" y="286.5" text-anchor="middle">ni se analizan</text>
<text class="s" x="95" y="305.5" text-anchor="middle">los riesgos</text>
<text class="s" x="160" y="128" text-anchor="middle"></text>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M620 152V178" marker-end="url(#t01eipd-k)"/>
<rect class="box" x="545" y="180" width="150" height="46" rx="6"/>
<text class="b" x="620" y="208" text-anchor="middle">¿Es aceptable?</text>
<path class="sgood" d="M545 203H355V230" marker-end="url(#t01eipd-g)"/>
<text class="b" x="470" y="195" text-anchor="middle">Sí</text>
<rect class="c1" x="230" y="232" width="250" height="80" rx="6"/>
<text class="b" x="355" y="266" text-anchor="middle">Se puede tratar</text>
<text class="s" x="355" y="288" text-anchor="middle">documentando la decisión</text>
<path class="sbad" d="M620 228V258" marker-end="url(#t01eipd-r)"/>
<text class="b" x="610" y="248" text-anchor="end">No, sigue alto</text>
<rect class="c5" x="545" y="260" width="150" height="96" rx="6"/>
<text class="b" x="620" y="292" text-anchor="middle">Consulta previa</text>
<text class="s" x="620" y="313" text-anchor="middle">a la AEPD antes de</text>
<text class="s" x="620" y="334" text-anchor="middle">empezar (art. 36)</text>
<text class="s" x="20" y="345">El paso 1 va primero: si la medida es</text>
<text class="s" x="20" y="363">desproporcionada, todo acaba ahí.</text>
</svg>
