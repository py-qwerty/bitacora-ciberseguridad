<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
<text class="h" x="360" y="28" text-anchor="middle">El Reglamento de IA regula usos según su riesgo</text>
<path class="c5" d="M152.5 140L220 50H220L287.5 140z"/>
<text class="b" x="220" y="120" text-anchor="middle">Prohibido</text>
<path class="dash" d="M261.75 95H440"/>
<text class="b" x="450" y="80">No se puede utilizar</text>
<text class="s" x="450" y="102">Manipular, puntuación social,</text>
<text class="s" x="450" y="120">predecir delitos individuales</text>
<path class="c3" d="M80.5 236L148 146H292L359.5 236z"/>
<text class="b" x="220" y="208" text-anchor="middle">Alto riesgo</text>
<path class="dash" d="M333.75 191H440"/>
<text class="b" x="450" y="176">Permitido con requisitos estrictos</text>
<text class="s" x="450" y="198">Admitir alumnos, despedir,</text>
<text class="s" x="450" y="216">subvenciones, fronteras</text>
<path class="c1" d="M8.5 332L76 242H364L431.5 332z"/>
<text class="b" x="220" y="304" text-anchor="middle">Transparencia</text>
<path class="dash" d="M405.75 287H440"/>
<text class="b" x="450" y="272">Obligación de informar</text>
<text class="s" x="450" y="294">Chatbots, contenido</text>
<text class="s" x="450" y="312">sintético, deepfakes</text>
<text class="s" x="360" y="362" text-anchor="middle">Aparte: modelos de propósito general (normas reforzadas si hay riesgo sistémico).</text>
<text class="s" x="360" y="380" text-anchor="middle">Aunque el RIA permita un uso, sigue haciendo falta cumplir el RGPD.</text>
</svg>
