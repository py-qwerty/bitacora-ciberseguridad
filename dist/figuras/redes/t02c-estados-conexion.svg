<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500">
<defs><marker id="t02ce-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="box" x="20" y="20" width="180" height="38" rx="4"/>
<text class="b" x="110" y="45" text-anchor="middle">Cliente</text>
