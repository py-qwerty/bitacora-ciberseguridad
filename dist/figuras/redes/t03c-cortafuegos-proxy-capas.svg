<text class="s" x="565" y="310" text-anchor="middle">Recibe la petición, lee el contenido</text>
<text class="s" x="565" y="330" text-anchor="middle">y crea paquetes nuevos hacia el otro lado.</text>
<text class="b" x="195" y="380" text-anchor="middle" style="font-size:15px">¿Modifica el tráfico? No</text>
<text class="s" x="195" y="402" text-anchor="middle">Ejemplo: bloquear puertos inseguros</text>
<text class="b" x="565" y="380" text-anchor="middle" style="font-size:15px">¿Modifica el tráfico? Sí, en la aplicación</text>
<text class="s" x="565" y="402" text-anchor="middle">Ejemplo: restringir webs, anonimato, caché</text>
