<text class="b" x="350.0" y="111.4" text-anchor="middle">Balanceador</text>
<text class="s" x="350.0" y="130.0" text-anchor="middle">delayed binding: espera</text>
<text class="s" x="350.0" y="148.0" text-anchor="middle">la cabecera completa</text>
<text class="s" x="262" y="192">· frena Slowloris</text>
<text class="s" x="262" y="211">· limita tamaño y tiempo</text>
<text class="s" x="262" y="230">  de las conexiones</text>
<text class="s" x="262" y="249">· deniega métodos HTTP</text>
<text class="s" x="262" y="268">  que no se usan</text>
