<text class="b" x="610" y="80" text-anchor="middle">Autoridad</text>
<text class="b" x="610" y="100" text-anchor="middle">raíz</text>
<text x="534" y="140">Está en la lista</text>
<text x="534" y="168">de confianza:</text>
<text x="534" y="196">el verificador ya</text>
<text x="534" y="224">confía en ella</text>
