<defs><marker id="t10pc-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker><marker id="t10pc-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker><marker id="t10pc-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="good" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="h" x="170" y="24" text-anchor="middle">Objeto del encargo</text>
<text class="h" x="550" y="24" text-anchor="middle">Conclusiones</text>
<rect class="c4" x="20" y="56" width="300" height="60" rx="8"/>
<text class="b" x="36" y="92">1.</text>
<text x="60" y="92" style="font-size:15px">¿Se conectó un USB a E1?</text>
<rect class="c1" x="400" y="56" width="300" height="60" rx="8"/>
<text class="b" x="416" y="92">1.</text>
<text x="440" y="92" style="font-size:15px">Sí: el 12/03 a las 18:02</text>
<path class="ln" d="M322 86L396 86" marker-end="url(#t10pc-ink)"/>
<rect class="c4" x="20" y="142" width="300" height="60" rx="8"/>
<text class="b" x="36" y="178">2.</text>
<text x="60" y="178" style="font-size:15px">¿Se accedió a las carpetas?</text>
<rect class="c1" x="400" y="142" width="300" height="60" rx="8"/>
<text class="b" x="416" y="178">2.</text>
<text x="440" y="178" style="font-size:15px">Sí: se accedió el 12/03</text>
<path class="ln" d="M322 172L396 172" marker-end="url(#t10pc-ink)"/>
<rect class="c4" x="20" y="228" width="300" height="60" rx="8"/>
<text class="b" x="36" y="264">3.</text>
<text x="60" y="264" style="font-size:15px">¿Llegaron los archivos a E2?</text>
<rect class="c3" x="400" y="228" width="300" height="60" rx="8"/>
<text class="b" x="416" y="254">3.</text>
<text x="440" y="254" style="font-size:15px">No se puede determinar:</text>
<text class="s" x="440" y="274">E2 cifrado, sin clave</text>
<path class="ln" d="M322 258L396 258" marker-end="url(#t10pc-ink)"/>
<text class="s" x="360" y="318" text-anchor="middle">Mismo orden y numeración. Si una no se puede contestar, se dice y se explica por qué;</text>
<text class="s" x="360" y="338" text-anchor="middle">nunca se supone lo que «probablemente» habría. Claras, rotundas y ajustadas a lo pedido.</text>
