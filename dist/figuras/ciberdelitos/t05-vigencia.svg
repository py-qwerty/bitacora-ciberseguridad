<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
<text class="h" x="360" y="30" text-anchor="middle">Dos formas de que un certificado deje de valer</text>
<path class="dash" d="M150 120H640"/>
<text class="s" x="150" y="146" text-anchor="middle">Se emite</text>
<path d="M640 108v24" style="stroke:var(--color-text);stroke-width:2"/>
<text class="s" x="640" y="150" text-anchor="middle">Fin de vigencia</text>
<path class="dash" d="M150 240H640"/>
<text class="s" x="150" y="266" text-anchor="middle">Se emite</text>
<path d="M640 228v24" style="stroke:var(--color-text);stroke-width:2"/>
<text class="s" x="640" y="270" text-anchor="middle">Fin de vigencia</text>
<text class="b" x="20" y="126">Caducidad</text>
<rect class="c1" x="150" y="108" width="490" height="24" rx="4"/>
<text class="b" x="395" y="125" text-anchor="middle">Válido</text>
<text class="b" x="650" y="126">Caduca</text>
<text class="b" x="20" y="246">Revocación</text>
<rect class="c1" x="150" y="228" width="230" height="24" rx="4"/>
<text class="b" x="265" y="245" text-anchor="middle">Válido</text>
<rect class="c5" x="380" y="228" width="260" height="24" rx="4"/>
<text class="b" x="510" y="245" text-anchor="middle">Ya no vale (revocado)</text>
<path class="sbad" d="M370 214l20 20M390 214l-20 20" style="stroke-width:3"/>
<text class="s" x="380" y="200" text-anchor="middle">El prestador lo anula antes de tiempo</text>
<text class="s" x="20" y="174">Llega la fecha de fin que figura en el propio certificado.</text>
<rect class="tint" x="20" y="300" width="680" height="64" rx="6"/>
<text class="b" x="360" y="327" text-anchor="middle">Mirar la fecha no basta: hay que preguntar al prestador si está revocado</text>
<text class="s" x="360" y="347" text-anchor="middle">(por ejemplo, porque perdiste el DNIe, te lo robaron o copiaron tu clave privada).</text>
</svg>
