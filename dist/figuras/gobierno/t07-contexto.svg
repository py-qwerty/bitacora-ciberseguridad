<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440">
<rect class="c4" x="20" y="20" width="700" height="400" rx="30"/>
<text class="h" x="370" y="52" text-anchor="middle">Contexto externo</text>
<text class="s" x="370" y="78" text-anchor="middle" style="font-size:13px">entorno sociocultural, político, legal, financiero, tecnológico, natural, competitivo</text>
<text class="s" x="370" y="98" text-anchor="middle" style="font-size:13px">nivel internacional, nacional, regional o local · tendencias clave · partes interesadas externas</text>
<rect class="c1" x="110" y="130" width="520" height="230" rx="24"/>
<text class="h" x="370" y="164" text-anchor="middle">Contexto interno</text>
<text class="s" x="370" y="192" text-anchor="middle" style="font-size:14px">gobierno, estructura, funciones y responsabilidades</text>
<text class="s" x="370" y="214" text-anchor="middle" style="font-size:14px">políticas, objetivos y estrategias</text>
<text class="s" x="370" y="236" text-anchor="middle" style="font-size:14px">recursos y conocimientos (capital, personas, sistemas)</text>
<text class="s" x="370" y="258" text-anchor="middle" style="font-size:14px">cultura y partes interesadas internas</text>
<text class="s" x="370" y="280" text-anchor="middle" style="font-size:14px">flujos de información, normas adoptadas, contratos</text>
<rect class="ink" x="270" y="310" width="200" height="40" rx="6"/>
<text class="b w" x="370" y="335" text-anchor="middle">Objetivos</text>
<text class="b" x="370" y="394" text-anchor="middle" style="font-size:14px">Ej. externo: sequía en la región · Ej. interno: la cultura de la empresa</text>
</svg>
