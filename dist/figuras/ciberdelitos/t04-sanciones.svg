<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
<text class="h" x="360" y="28" text-anchor="middle">La escalera de sanciones de la LSSI</text>
<rect class="c1" x="30" y="210" width="210" height="140" rx="4"/>
<text class="b" x="135" y="240" text-anchor="middle">Leve</text>
<text x="135" y="266" text-anchor="middle">hasta 30 000 €</text>
<text class="s" x="135" y="298" text-anchor="middle">Prescriben:</text>
<text class="s" x="135" y="318" text-anchor="middle">la infracción, 6 meses</text>
<text class="s" x="135" y="336" text-anchor="middle">la sanción, 1 año</text>
<rect class="c3" x="255" y="140" width="210" height="210" rx="4"/>
<text class="b" x="360" y="170" text-anchor="middle">Grave</text>
<text x="360" y="196" text-anchor="middle">30 001 – 150 000 €</text>
<text class="s" x="360" y="228" text-anchor="middle">Prescriben:</text>
<text class="s" x="360" y="248" text-anchor="middle">la infracción, 2 años</text>
<text class="s" x="360" y="266" text-anchor="middle">la sanción, 2 años</text>
<rect class="c5" x="480" y="70" width="210" height="280" rx="4"/>
<text class="b" x="585" y="100" text-anchor="middle">Muy grave</text>
<text x="585" y="126" text-anchor="middle">150 001 – 600 000 €</text>
<text class="s" x="585" y="158" text-anchor="middle">Prescriben:</text>
<text class="s" x="585" y="178" text-anchor="middle">la infracción, 3 años</text>
<text class="s" x="585" y="196" text-anchor="middle">la sanción, 3 años</text>
<path class="ln" d="M20 350H700"/>
<text class="s" x="360" y="380" text-anchor="middle">Ejemplo: usar cookies sin consentimiento (art. 22.2) es infracción grave.</text>
</svg>
