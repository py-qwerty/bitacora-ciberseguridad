<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460">
<defs><marker id="t05fa-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker><marker id="t05fa-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker><marker id="t05fa-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="good" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="h" x="360" y="24" text-anchor="middle">Una entrada FAT de 32 bytes, borrada</text>
<rect class="c5" x="20" y="56" width="36" height="44" rx="3"/>
<text class="b" x="38" y="83" text-anchor="middle">E5</text>
<rect class="c4" x="58" y="56" width="150" height="44" rx="3"/>
<text class="b" x="133" y="83" text-anchor="middle">ORMIGA</text>
<rect class="c4" x="210" y="56" width="62" height="44" rx="3"/>
<text class="b" x="241" y="83" text-anchor="middle">JPG</text>
<rect class="tint" x="274" y="56" width="44" height="44" rx="3"/>
<text class="b" x="296" y="83" text-anchor="middle">atr.</text>
<rect class="tint" x="320" y="56" width="150" height="44" rx="3"/>
<text class="b" x="395" y="83" text-anchor="middle">fechas</text>
<rect class="c1" x="472" y="56" width="96" height="44" rx="3"/>
<text class="b" x="520" y="83" text-anchor="middle">clúster 2</text>
<rect class="c1" x="570" y="56" width="122" height="44" rx="3"/>
<text class="b" x="631" y="83" text-anchor="middle">183.857 B</text>
<text class="s" x="38" y="124" text-anchor="middle">1.º</text>
<text class="s" x="130" y="124" text-anchor="middle">nombre 8.3 (11 bytes)</text>
<text class="s" x="382" y="124" text-anchor="middle">creación, acceso, modif.</text>
<text class="s" x="506" y="124" text-anchor="middle">primer clúster</text>
<text class="s" x="637" y="124" text-anchor="middle">tamaño</text>
<rect class="c5" x="20" y="140" width="680" height="62" rx="8" style="fill-opacity:.4"/>
<text class="b" x="360" y="166" text-anchor="middle">0xE5 = archivo eliminado. FAT solo cambia la primera letra:</text>
<text class="s" x="360" y="188" text-anchor="middle">se ve «?ORMIGA.JPG» (seguramente HORMIGA), pero el resto se conserva.</text>
<text class="b" x="20" y="236">¿Cuántos clústeres ocupa? (sector = 512 B · clúster = 8 sectores = 4096 B)</text>
<text x="20" y="262">183.857 B ÷ 512 = 359,1 → 360 sectores ÷ 8 = 45 clústeres (del 2 al 46)</text>
<rect class="c1" x="20" y="286" width="50" height="44" rx="4"/>
<text class="s" x="45" y="350" text-anchor="middle">2</text>
<rect class="c1" x="76" y="286" width="50" height="44" rx="4"/>
<text class="s" x="101" y="350" text-anchor="middle">3</text>
<rect class="c1" x="132" y="286" width="50" height="44" rx="4"/>
<text class="s" x="157" y="350" text-anchor="middle">4</text>
<rect class="c1" x="188" y="286" width="50" height="44" rx="4"/>
<text class="s" x="213" y="350" text-anchor="middle">5</text>
<rect class="c1" x="244" y="286" width="50" height="44" rx="4"/>
<text class="s" x="269" y="350" text-anchor="middle">…</text>
<rect class="c1" x="300" y="286" width="50" height="44" rx="4"/>
<text class="s" x="325" y="350" text-anchor="middle">…</text>
<rect class="c1" x="356" y="286" width="50" height="44" rx="4"/>
<text class="s" x="381" y="350" text-anchor="middle">…</text>
<rect class="c1" x="412" y="286" width="50" height="44" rx="4"/>
<text class="s" x="437" y="350" text-anchor="middle">43</text>
<rect class="c1" x="468" y="286" width="50" height="44" rx="4"/>
<text class="s" x="493" y="350" text-anchor="middle">44</text>
<rect class="c1" x="524" y="286" width="50" height="44" rx="4"/>
<text class="s" x="549" y="350" text-anchor="middle">45</text>
<rect class="c1" x="580" y="286" width="50" height="44" rx="4"/>
<text class="s" x="605" y="350" text-anchor="middle">46</text>
<rect class="c3" x="636" y="286" width="50" height="44" rx="4"/>
<text class="s" x="661" y="350" text-anchor="middle">47</text>
<rect class="box" x="580" y="286" width="50" height="44" rx="4"/>
<rect class="c1" x="580" y="286" width="18" height="44" rx="4"/>
<text class="s" x="661" y="368" text-anchor="middle">?EADOW</text>
<text class="s" x="300" y="368" text-anchor="middle">45 clústeres seguidos de ?ORMIGA</text>
<text class="s" x="360" y="398" text-anchor="middle">Un archivo ocupa clústeres completos: el último solo se llena en parte.</text>
<text class="b" x="360" y="420" text-anchor="middle">Con el clúster inicial y el tamaño se sabe exactamente qué leer para recuperarlo.</text>
</svg>
