<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480">
<defs><marker id="t5m-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--color-secondary)"/></marker><marker id="t5m-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker><marker id="t5m-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="good" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="ink" x="10" y="8" width="730" height="40" rx="4"/>
<text class="w b" x="375" y="35" text-anchor="middle">Herramientas de seguridad: DLP, proxy y SIEM</text>
<rect class="c3" x="12" y="60" width="176" height="38" rx="4"/>
<text class="b" x="100" y="84.5" text-anchor="middle">DLP</text>
<path class="ln" d="M100.0 98V112" marker-end="url(#t5m-a)"/>
<rect class="tint" x="16" y="114" width="168" height="76" rx="6"/>
<text class="b" x="100" y="137.5" text-anchor="middle">Que la información</text>
<text class="b" x="100" y="157.5" text-anchor="middle">sensible no salga</text>
<text class="b" x="100" y="177.5" text-anchor="middle">sin permiso</text>
<path class="ln" d="M100.0 190V208" marker-end="url(#t5m-a)"/>
<rect class="box" x="20" y="210" width="160" height="84" rx="4" stroke-dasharray="5 4"/>
<text x="100" y="237.5" text-anchor="middle">Vigila la red,</text>
<text x="100" y="257.5" text-anchor="middle">el puesto o el</text>
<text x="100" y="277.5" text-anchor="middle">centro de datos</text>
<path class="ln" d="M100.0 294V312" marker-end="url(#t5m-a)"/>
<rect class="box" x="20" y="314" width="160" height="84" rx="4" stroke-dasharray="5 4"/>
<text x="100" y="341.5" text-anchor="middle">Varios métodos</text>
<text x="100" y="361.5" text-anchor="middle">para reconocer</text>
<text x="100" y="381.5" text-anchor="middle">datos sensibles</text>
<rect class="c4" x="196" y="60" width="176" height="38" rx="4"/>
<text class="b" x="284" y="84.5" text-anchor="middle">Proxy</text>
<path class="ln" d="M284.0 98V112" marker-end="url(#t5m-a)"/>
<rect class="tint" x="200" y="114" width="168" height="76" rx="6"/>
<text class="b" x="284" y="137.5" text-anchor="middle">Intermediario</text>
<text class="b" x="284" y="157.5" text-anchor="middle">obligatorio entre</text>
<text class="b" x="284" y="177.5" text-anchor="middle">dos redes</text>
<path class="ln" d="M284.0 190V208" marker-end="url(#t5m-a)"/>
<rect class="box" x="204" y="210" width="160" height="84" rx="4" stroke-dasharray="5 4"/>
<text x="284" y="237.5" text-anchor="middle">Mira, filtra,</text>
<text x="284" y="257.5" text-anchor="middle">registra o guarda</text>
<text x="284" y="277.5" text-anchor="middle">lo que pasa</text>
<path class="ln" d="M284.0 294V312" marker-end="url(#t5m-a)"/>
<rect class="box" x="204" y="314" width="160" height="84" rx="4" stroke-dasharray="5 4"/>
<text x="284" y="341.5" text-anchor="middle">Cada tipo se</text>
<text x="284" y="361.5" text-anchor="middle">orienta a una</text>
<text x="284" y="381.5" text-anchor="middle">aplicación (web…)</text>
<rect class="c2" x="380" y="60" width="176" height="38" rx="4"/>
<text class="b" x="468" y="84.5" text-anchor="middle">SIEM</text>
<path class="ln" d="M468.0 98V112" marker-end="url(#t5m-a)"/>
<rect class="tint" x="384" y="114" width="168" height="76" rx="6"/>
<text class="b" x="468" y="147.5" text-anchor="middle">Une los logs</text>
<text class="b" x="468" y="167.5" text-anchor="middle">de toda la red</text>
<path class="ln" d="M468.0 190V208" marker-end="url(#t5m-a)"/>
<rect class="box" x="388" y="210" width="160" height="64" rx="4" stroke-dasharray="5 4"/>
<text x="468" y="237.5" text-anchor="middle">1. Recoge logs</text>
<text x="468" y="257.5" text-anchor="middle">de muchas fuentes</text>
<path class="ln" d="M468.0 274V292" marker-end="url(#t5m-a)"/>
<rect class="box" x="388" y="294" width="160" height="64" rx="4" stroke-dasharray="5 4"/>
<text x="468" y="321.5" text-anchor="middle">2. Correlaciona</text>
<text x="468" y="341.5" text-anchor="middle">los logs</text>
<path class="ln" d="M468.0 358V376" marker-end="url(#t5m-a)"/>
<rect class="box" x="388" y="378" width="160" height="44" rx="4" stroke-dasharray="5 4"/>
<text x="468" y="405.5" text-anchor="middle">3. Genera alertas</text>
<rect class="c1" x="564" y="60" width="176" height="38" rx="4"/>
<text class="b" x="652" y="84.5" text-anchor="middle">Squid (práctica)</text>
<path class="ln" d="M652.0 98V112" marker-end="url(#t5m-a)"/>
<rect class="tint" x="568" y="114" width="168" height="76" rx="6"/>
<text class="b" x="652" y="147.5" text-anchor="middle">Proxy web caché</text>
<text class="b" x="652" y="167.5" text-anchor="middle">de software libre</text>
<path class="ln" d="M652.0 190V208" marker-end="url(#t5m-a)"/>
<rect class="box" x="572" y="210" width="160" height="64" rx="4" stroke-dasharray="5 4"/>
<text x="652" y="237.5" text-anchor="middle">Se configura en</text>
<text x="652" y="257.5" text-anchor="middle">/etc/squid/squid.conf</text>
<path class="ln" d="M652.0 274V292" marker-end="url(#t5m-a)"/>
<rect class="box" x="572" y="294" width="160" height="64" rx="4" stroke-dasharray="5 4"/>
<text x="652" y="321.5" text-anchor="middle">Filtra por usuario,</text>
<text x="652" y="341.5" text-anchor="middle">dominio, horario…</text>
<text class="s" x="375" y="470" text-anchor="middle">Las tres primeras vigilan de forma proactiva; Squid es el proxy que el tema configura.</text>
</svg>
