<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400">
<rect class="ink" x="250" y="150" width="240" height="90" rx="45"/>
<text class="b w" x="370" y="190" text-anchor="middle">Información</text>
<text class="w" x="370" y="212" text-anchor="middle" style="font-size:12px">se almacena, procesa y transmite</text>
<rect class="c2" x="20" y="30" width="240" height="96" rx="10"/>
<text class="b" x="140" y="60" text-anchor="middle">Personas</text>
<text class="s" x="140" y="82" text-anchor="middle">empleados, administradores</text>
<text class="s" x="140" y="108" text-anchor="middle" style="fill:var(--color-danger)">⚠ ingeniería social</text>
<path class="ln" d="M260 78L280 160"/>
<rect class="c4" x="480" y="30" width="240" height="96" rx="10"/>
<text class="b" x="600" y="60" text-anchor="middle">Datos</text>
<text class="s" x="600" y="82" text-anchor="middle">bases de datos, documentos</text>
<text class="s" x="600" y="108" text-anchor="middle" style="fill:var(--color-danger)">⚠ robo o alteración</text>
<path class="ln" d="M480 78L460 160"/>
<rect class="c3" x="20" y="270" width="240" height="96" rx="10"/>
<text class="b" x="140" y="300" text-anchor="middle">Procedimientos</text>
<text class="s" x="140" y="322" text-anchor="middle">altas, copias…</text>
<text class="s" x="140" y="348" text-anchor="middle" style="fill:var(--color-danger)">⚠ pasos sin control</text>
<path class="ln" d="M260 318L280 230"/>
<rect class="c1" x="480" y="270" width="240" height="96" rx="10"/>
<text class="b" x="600" y="300" text-anchor="middle">Recursos técnicos</text>
<text class="s" x="600" y="322" text-anchor="middle">servidores, redes, apps</text>
<text class="s" x="600" y="348" text-anchor="middle" style="fill:var(--color-danger)">⚠ malware, intrusiones</text>
<path class="ln" d="M480 318L460 230"/>
<text class="s" x="370" y="396" text-anchor="middle">Hay que proteger el SIC de forma global: todos y cada uno de sus elementos.</text>
</svg>
