<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
<rect class="c4" x="20" y="14" width="216" height="44" rx="6"/>
<text class="b" x="128" y="41" text-anchor="middle">Confidencialidad</text>
<text class="s" x="128" y="82" text-anchor="middle">Que solo accedan</text>
<text class="s" x="128" y="102" text-anchor="middle">los autorizados</text>
<path class="box" d="M94.0 150q34 -30 68 0q-34 30 -68 0z"/><circle class="ink" cx="128.0" cy="150" r="10"/>
<text class="s" x="128" y="200" text-anchor="middle">En el diario:</text>
<text class="b" x="128" y="220" text-anchor="middle">Leer el diario</text>
<text class="b" x="128" y="240" text-anchor="middle">sin permiso</text>
<text class="s" x="128" y="266" text-anchor="middle">En un sistema:</text>
<text x="128" y="286" text-anchor="middle">Entrar en ficheros,</text>
<text x="128" y="306" text-anchor="middle">espiar correos</text>
<rect class="tint" x="28" y="322" width="200" height="40" rx="6"/>
<text class="b" x="128" y="347" text-anchor="middle">Art. 197 y 197 bis</text>
<rect class="c3" x="252" y="14" width="216" height="44" rx="6"/>
<text class="b" x="360" y="41" text-anchor="middle">Integridad</text>
<text class="s" x="360" y="82" text-anchor="middle">Que los datos no se</text>
<text class="s" x="360" y="102" text-anchor="middle">alteren sin permiso</text>
<path class="box" d="M338.0 124h44v52h-44z"/><path class="sbad" d="M338.0 150l10 -6l10 8l10 -8l14 6"/><path class="dash" d="M346.0 134h28M346.0 164h28"/>
<text class="s" x="360" y="200" text-anchor="middle">En el diario:</text>
<text class="b" x="360" y="220" text-anchor="middle">Arrancar o reescribir</text>
<text class="b" x="360" y="240" text-anchor="middle">páginas</text>
<text class="s" x="360" y="266" text-anchor="middle">En un sistema:</text>
<text x="360" y="286" text-anchor="middle">Borrar, modificar o</text>
<text x="360" y="306" text-anchor="middle">corromper ficheros</text>
<rect class="tint" x="260" y="322" width="200" height="40" rx="6"/>
<text class="b" x="360" y="347" text-anchor="middle">Art. 264 (datos)</text>
<rect class="c5" x="484" y="14" width="216" height="44" rx="6"/>
<text class="b" x="592" y="41" text-anchor="middle">Disponibilidad</text>
<text class="s" x="592" y="82" text-anchor="middle">Que el sistema funcione</text>
<text class="s" x="592" y="102" text-anchor="middle">cuando se necesita</text>
<path d="M583.0 148v-8a9 9 0 0 1 18 0v8" style="fill:none;stroke:var(--color-text);stroke-width:3"/><rect class="c3" x="578.0" y="148" width="28" height="22" rx="3"/><circle class="ink" cx="592.0" cy="158" r="3"/>
<text class="s" x="592" y="200" text-anchor="middle">En el diario:</text>
<text class="b" x="592" y="220" text-anchor="middle">Cerrar el cajón</text>
<text class="b" x="592" y="240" text-anchor="middle">con un candado</text>
<text class="s" x="592" y="266" text-anchor="middle">En un sistema:</text>
<text x="592" y="286" text-anchor="middle">Dejar un sistema fuera</text>
<text x="592" y="306" text-anchor="middle">de servicio (DoS)</text>
<rect class="tint" x="492" y="322" width="200" height="40" rx="6"/>
<text class="b" x="592" y="347" text-anchor="middle">Art. 264 bis (sistemas)</text>
<text class="s" x="360" y="388" text-anchor="middle">En el recuadro inferior: dónde lo verás en el Código Penal (apartados siguientes).</text>
</svg>
