<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430">
<rect class="c2" x="20" y="30" width="480" height="76" rx="6"/>
<text class="b" x="36" y="60">Política</text>
<text class="s" x="36" y="84">objetivos de alto nivel</text>
<text x="486" y="74" text-anchor="end" style="font-size:14px">«Proteger los datos de clientes»</text>
<rect class="c4" x="60" y="116" width="440" height="76" rx="6"/>
<text class="b" x="76" y="146">Estándar</text>
<text class="s" x="76" y="170">qué herramienta o tecnología</text>
<text x="486" y="160" text-anchor="end" style="font-size:14px">«Cifrado de disco completo»</text>
<rect class="c3" x="100" y="202" width="400" height="76" rx="6"/>
<text class="b" x="116" y="232">Línea base</text>
<text class="s" x="116" y="256">qué parámetros mínimos</text>
<text x="486" y="246" text-anchor="end" style="font-size:14px">«Contraseña de 12 caracteres»</text>
<rect class="c1" x="140" y="288" width="360" height="76" rx="6"/>
<text class="b" x="156" y="318">Procedimiento</text>
<text class="s" x="156" y="342">paso a paso, día a día</text>
<text x="486" y="332" text-anchor="end" style="font-size:14px">«Alta: 1) cuenta, 2) grupo…»</text>
<text class="s" x="260" y="384" text-anchor="middle">Obligatorios · de lo general (arriba) a lo concreto (abajo)</text>
<rect class="box" x="540" y="110" width="180" height="190" rx="8" style="stroke-dasharray:6 4"/>
<text class="b" x="630" y="140" text-anchor="middle">Directriz</text>
<text class="s" x="630" y="166" text-anchor="middle">recomendación,</text>
<text class="s" x="630" y="186" text-anchor="middle">buena práctica</text>
<text class="s" x="630" y="206" text-anchor="middle"></text>
<text class="s" x="630" y="226" text-anchor="middle">No obligatoria,</text>
<text class="s" x="630" y="246" text-anchor="middle">pero debe tenerse</text>
<text class="s" x="630" y="266" text-anchor="middle">en cuenta</text>
<text class="s" x="630" y="402" text-anchor="middle">«No repitas la contraseña</text>
<text class="s" x="630" y="418" text-anchor="middle">en servicios personales»</text>
<path class="dash" d="M630 304V384"/>
</svg>
