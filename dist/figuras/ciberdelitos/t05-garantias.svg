<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
<text class="h" x="360" y="30" text-anchor="middle">Qué garantiza (y qué no) una firma electrónica</text>
<path class="box" d="M318 120h64l20 20v100h-84z"/>
<path class="dash" d="M332 150h52"/>
<path class="dash" d="M332 164h52"/>
<path class="dash" d="M332 178h52"/>
<path class="dash" d="M332 192h52"/>
<circle class="c1" cx="392" cy="232" r="20"/>
<path d="M382 232l7 7l13 -14" style="fill:none;stroke:#176447;stroke-width:3"/>
<text class="b" x="360" y="276" text-anchor="middle">Documento firmado</text>
<rect class="c1" x="16" y="64" width="250" height="68" rx="6"/>
<text class="b" x="141" y="93" text-anchor="middle">Integridad</text>
<text class="s" x="141" y="113" text-anchor="middle">¿Lo han tocado después?</text>
<circle class="good" cx="16" cy="98" r="11"/><path d="M10 98l4 4l8 -8" style="fill:none;stroke:#fff;stroke-width:2.5"/>
<path class="ln" d="M266 98L316 180"/>
<rect class="c1" x="16" y="156" width="250" height="68" rx="6"/>
<text class="b" x="141" y="185" text-anchor="middle">Autenticidad</text>
<text class="s" x="141" y="205" text-anchor="middle">¿Quién lo ha firmado?</text>
<circle class="good" cx="16" cy="190" r="11"/><path d="M10 190l4 4l8 -8" style="fill:none;stroke:#fff;stroke-width:2.5"/>
<path class="ln" d="M266 190L316 180"/>
<rect class="c1" x="16" y="248" width="250" height="68" rx="6"/>
<text class="b" x="141" y="277" text-anchor="middle">No repudio</text>
<text class="s" x="141" y="297" text-anchor="middle">¿Puede decir «yo no fui»?</text>
<circle class="good" cx="16" cy="282" r="11"/><path d="M10 282l4 4l8 -8" style="fill:none;stroke:#fff;stroke-width:2.5"/>
<path class="ln" d="M266 282L316 180"/>
<rect class="c5" x="454" y="96" width="250" height="80" rx="6"/>
<text class="b" x="579" y="121" text-anchor="middle">Confidencialidad</text>
<text class="s" x="579" y="141" text-anchor="middle">No oculta el contenido:</text>
<text class="s" x="579" y="161" text-anchor="middle">eso es cifrar</text>
<circle class="bad" cx="704" cy="136" r="11"/><path d="M699 131l10 10M709 131l-10 10" style="stroke:#fff;stroke-width:2.5"/>
<path class="dash" d="M454 136L404 180"/>
<rect class="c5" x="454" y="216" width="250" height="80" rx="6"/>
<text class="b" x="579" y="241" text-anchor="middle">Veracidad</text>
<text class="s" x="579" y="261" text-anchor="middle">No prueba que lo escrito</text>
<text class="s" x="579" y="281" text-anchor="middle">sea cierto</text>
<circle class="bad" cx="704" cy="256" r="11"/><path d="M699 251l10 10M709 251l-10 10" style="stroke:#fff;stroke-width:2.5"/>
<path class="dash" d="M454 256L404 180"/>
<text class="b" x="140" y="346" text-anchor="middle">Sí lo garantiza</text>
<text class="b" x="580" y="346" text-anchor="middle">No lo garantiza</text>
</svg>
