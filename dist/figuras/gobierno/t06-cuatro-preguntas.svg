<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400">
<circle class="ink" cx="370" cy="200" r="70"/>
<text class="b w" x="370" y="196" text-anchor="middle">Proteger la</text>
<text class="b w" x="370" y="216" text-anchor="middle">información</text>
<rect class="c2" x="20" y="40" width="260" height="110" rx="10"/>
<text class="h" x="150" y="76" text-anchor="middle">¿Qué?</text>
<text class="b" x="150" y="104" text-anchor="middle" style="font-size:15px">las 5 dimensiones</text>
<text class="s" x="150" y="126" text-anchor="middle">+ acceso y conservación</text>
<path class="dash" d="M280 95L308 170"/>
<rect class="c4" x="460" y="40" width="260" height="110" rx="10"/>
<text class="h" x="590" y="76" text-anchor="middle">¿Dónde?</text>
<text class="b" x="590" y="104" text-anchor="middle" style="font-size:15px">en los SIC,</text>
<text class="s" x="590" y="126" text-anchor="middle">con todos sus elementos</text>
<path class="dash" d="M460 95L432 170"/>
<rect class="c1" x="20" y="250" width="260" height="110" rx="10"/>
<text class="h" x="150" y="286" text-anchor="middle">¿Cómo?</text>
<text class="b" x="150" y="314" text-anchor="middle" style="font-size:15px">con salvaguardas</text>
<text class="s" x="150" y="336" text-anchor="middle">(controles)</text>
<path class="dash" d="M280 305L308 230"/>
<rect class="c3" x="460" y="250" width="260" height="110" rx="10"/>
<text class="h" x="590" y="286" text-anchor="middle">¿Cuándo?</text>
<text class="b" x="590" y="314" text-anchor="middle" style="font-size:15px">en todo el ciclo de vida,</text>
<text class="s" x="590" y="336" text-anchor="middle">de la entrada a la destrucción</text>
<path class="dash" d="M460 305L432 230"/>
<text class="s" x="370" y="390" text-anchor="middle">Cuatro preguntas, cuatro apartados del tema.</text>
</svg>
