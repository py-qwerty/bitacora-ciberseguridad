<text x="450" y="78">Copia o mira el patrón</text><text x="450" y="96">de los mensajes</text>
<text x="360" y="352" text-anchor="middle"><tspan class="b">El mensaje llega intacto:</tspan> Bob y Alice no notan nada.</text><text x="360" y="374" text-anchor="middle">Por eso se combate <tspan class="b">previniendo</tspan> (cifrando), no detectando.</text>
