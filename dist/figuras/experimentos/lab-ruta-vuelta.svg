" text-anchor="middle">El cortafuegos solo ve la ida: no puede filtrar ni registrar la respuesta.</text><text class="s" x="380" y="350" text-anchor="middle">Sin «10.10.1.0/24 via 10.10.2.2», el servidor usa su ruta por defecto</text><text class="s" x="380" y="370" text-anchor="middle">y la respuesta se escapa por la puerta de Docker, saltándose el cortafuegos.</text></svg>