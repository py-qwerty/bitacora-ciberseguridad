<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
<defs><marker id="t01marcono-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path style="fill:var(--color-primary)" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="c4" x="20" y="20" width="680" height="100" rx="8"/>
<text class="s" x="40" y="50">UNIÓN EUROPEA</text>
<text class="b" x="360" y="62" text-anchor="middle">RGPD · Reglamento (UE) 2016/679</text>
<text class="s" x="360" y="86" text-anchor="middle">Se aplica directamente en todos los Estados, sin ley nacional.</text>
<text class="s" x="360" y="106" text-anchor="middle">Se aplica desde el 25 de mayo de 2018.</text>
<path style="fill:none;stroke:var(--color-primary);stroke-width:2" d="M200 122V160" marker-end="url(#t01marcono-p)"/>
<text class="s" x="212" y="140">deja huecos que cada país puede completar, sin contradecirlo</text>
<rect class="c1" x="20" y="162" width="680" height="150" rx="8"/>
<text class="s" x="40" y="190">ESPAÑA</text>
<text class="b" x="360" y="192" text-anchor="middle">LOPDGDD · Ley Orgánica 3/2018 (5 de diciembre de 2018)</text>
<rect class="box" x="40" y="210" width="200" height="86" rx="6"/>
<text class="s" x="140" y="248" text-anchor="middle">Amplía los casos</text>
<text class="s" x="140" y="268" text-anchor="middle">en que hay que tener DPD</text>
<rect class="box" x="260" y="210" width="200" height="86" rx="6"/>
<text class="s" x="360" y="238" text-anchor="middle">Regula tratamientos</text>
<text class="s" x="360" y="258" text-anchor="middle">concretos: videovigilancia,</text>
<text class="s" x="360" y="278" text-anchor="middle">listas Robinson…</text>
<rect class="box" x="480" y="210" width="200" height="86" rx="6"/>
<text class="s" x="580" y="248" text-anchor="middle">Añade los</text>
<text class="s" x="580" y="268" text-anchor="middle">derechos digitales</text>
<rect class="c3" x="20" y="326" width="330" height="56" rx="8"/>
<text class="b" x="185" y="350" text-anchor="middle">Base: art. 18.4 Constitución (1978)</text>
<text class="s" x="185" y="370" text-anchor="middle">la ley limita el uso de la informática</text>
<rect class="c5" x="370" y="326" width="330" height="56" rx="8"/>
<text class="b" x="535" y="350" text-anchor="middle">AEPD: sus instrucciones</text>
<text class="s" x="535" y="370" text-anchor="middle">vigila que todo esto se cumpla</text>
</svg>
