<text class="s" x="59" y="360" text-anchor="middle">Sin</text>
<text class="s" x="59" y="376" text-anchor="middle">clasificar</text>
<text class="s" x="131" y="360" text-anchor="middle">Sensible*</text>
<text class="s" x="203" y="360" text-anchor="middle">Confiden-</text>
<text class="s" x="203" y="376" text-anchor="middle">cial</text>
