<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
<defs><marker id="t10evidenc-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path style="fill:var(--color-text)" d="M0 0L10 5L0 10z"/></marker><marker id="t10evidenc-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="c4" x="14" y="40" width="152" height="56" rx="6"/>
<text class="b" x="90" y="63" text-anchor="middle">Información</text>
<text class="b" x="90" y="83" text-anchor="middle">en un sistema</text>
<text class="s" x="90" y="122" text-anchor="middle">puede resolver el</text>
<text class="s" x="90" y="140" text-anchor="middle">delito o explicarlo</text>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M168 68H190" marker-end="url(#t10evidenc-k)"/>
<rect class="c3" x="194" y="40" width="152" height="56" rx="6"/>
<text class="b" x="270" y="73" text-anchor="middle">Evidencia digital</text>
<text class="s" x="270" y="122" text-anchor="middle">la información (y su</text>
<text class="s" x="270" y="140" text-anchor="middle">soporte) relevante</text>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M348 68H370" marker-end="url(#t10evidenc-k)"/>
<rect class="tint" x="374" y="40" width="152" height="56" rx="6"/>
<text class="b" x="450" y="73" text-anchor="middle">Salvaguarda</text>
<text class="s" x="450" y="122" text-anchor="middle">identificar, recoger</text>
<text class="s" x="450" y="140" text-anchor="middle">y preservar</text>
<path style="fill:none;stroke:var(--color-text);stroke-width:1.6" d="M528 68H550" marker-end="url(#t10evidenc-k)"/>
<rect class="c1" x="554" y="40" width="152" height="56" rx="6"/>
<text class="b" x="630" y="73" text-anchor="middle">Prueba</text>
<text class="s" x="630" y="122" text-anchor="middle">si el juez la admite</text>
<text class="s" x="630" y="140" text-anchor="middle">y la valora</text>
<text class="s" x="540" y="30" text-anchor="middle">se entrega a la autoridad judicial</text>
<rect class="c5" x="120" y="190" width="480" height="120" rx="10"/>
<text class="b" x="360" y="216" text-anchor="middle">Es frágil: se puede manipular, alterar o destruir</text>
<text class="s" x="240" y="244" text-anchor="middle">A propósito</text>
<text class="s" x="240" y="262" text-anchor="middle">alguien borra rastros</text>
<text class="s" x="480" y="244" text-anchor="middle">Por error</text>
<text class="s" x="480" y="262" text-anchor="middle">al recogerla, trasladarla,</text>
<text class="s" x="480" y="280" text-anchor="middle">guardarla o examinarla</text>
<path class="dash" d="M360 232V300"/>
<path class="sbad" d="M300 190L270 160" marker-end="url(#t10evidenc-r)"/>
<path class="sbad" d="M420 190L450 160" marker-end="url(#t10evidenc-r)"/>
<text class="s" x="360" y="338" text-anchor="middle">Mal identificada o manipulada queda inservible: sin análisis forense</text>
<text class="s" x="360" y="357" text-anchor="middle">y con impunidad para los autores. Por eso se documenta todo el proceso.</text>
</svg>
