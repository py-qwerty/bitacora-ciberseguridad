<rect class="sgood" x="156" y="294" width="214" height="120" rx="8" stroke-dasharray="6 4"/>
<text class="s" x="156" y="434">carpeta base de la aplicación</text>
<path class="path" d="M162 318C130 314 108 288 134 280" marker-end="url(#t03-path-traversal-r)" style="stroke-width:2.5"/>
<circle class="c5" cx="108" cy="298.0" r="10"/>
