<rect class="box" x="520" y="20" width="180" height="38" rx="4"/>
<text class="b" x="610" y="45" text-anchor="middle">Servidor</text>
<path class="dash" d="M610 58V262"/>
<path class="ln" d="M110 100H604" marker-end="url(#t02ce-a)" style="stroke:var(--color-text);stroke-width:2"/>
<text class="b" x="210" y="92" text-anchor="middle">1 · SYN</text>
<text class="s" x="210" y="118" text-anchor="middle">quiero conectar</text>
<path class="ln" d="M610 160H116" marker-end="url(#t02ce-a)" style="stroke:var(--color-text);stroke-width:2"/>
<text class="b" x="510" y="152" text-anchor="middle">2 · SYN/ACK</text>
<text class="s" x="510" y="178" text-anchor="middle">de acuerdo</text>
<path class="ln" d="M110 220H604" marker-end="url(#t02ce-a)" style="stroke:var(--color-text);stroke-width:2"/>
<text class="b" x="210" y="212" text-anchor="middle">3 · ACK</text>
<text class="s" x="210" y="238" text-anchor="middle">confirmado</text>
<rect class="c3" x="296" y="85" width="128" height="30" rx="4"/>
<text class="b" x="360" y="105" text-anchor="middle" style="font-size:14px">NEW</text>
<rect class="c1" x="296" y="145" width="128" height="30" rx="4"/>
<text class="b" x="360" y="165" text-anchor="middle" style="font-size:14px">ESTABLISHED</text>
<rect class="c1" x="296" y="205" width="128" height="30" rx="4"/>
<text class="b" x="360" y="225" text-anchor="middle" style="font-size:14px">ESTABLISHED</text>
<text class="s" x="360" y="284" text-anchor="middle">El cortafuegos marca la conexión NEW con el primer paquete y ESTABLISHED</text>
<text class="s" x="360" y="302" text-anchor="middle">en cuanto ve pasar la respuesta. Con -m state decides según ese estado.</text>
<text class="b" x="30" y="330" style="font-family:monospace">conntrack -L</text>
<text class="s" x="160" y="330">lista la tabla de conexiones que guarda el núcleo (simplificada):</text>
<rect class="tint" x="30" y="342" width="660" height="30" rx="0"/>
<text class="b" x="40" y="362" style="font-size:14px">protocolo</text>
<text class="b" x="130" y="362" style="font-size:14px">estado</text>
<text class="b" x="280" y="362" style="font-size:14px">origen</text>
<text class="b" x="420" y="362" style="font-size:14px">destino</text>
<text class="b" x="560" y="362" style="font-size:14px">puertos</text>
<rect class="box" x="30" y="372" width="660" height="30" rx="0"/>
<text class="s" x="40" y="392" style="font-family:monospace">tcp</text>
<text class="s" x="130" y="392" style="font-family:monospace">ESTABLISHED</text>
<text class="s" x="280" y="392" style="font-family:monospace">10.0.2.15</text>
<text class="s" x="420" y="392" style="font-family:monospace">203.0.113.10</text>
<text class="s" x="560" y="392" style="font-family:monospace">51000 → 443</text>
<rect class="box" x="30" y="402" width="660" height="30" rx="0"/>
<text class="s" x="40" y="422" style="font-family:monospace">tcp</text>
<text class="s" x="130" y="422" style="font-family:monospace">TIME_WAIT</text>
<text class="s" x="280" y="422" style="font-family:monospace">10.0.2.15</text>
<text class="s" x="420" y="422" style="font-family:monospace">198.51.100.7</text>
<text class="s" x="560" y="422" style="font-family:monospace">35878 → 80</text>
<rect class="box" x="30" y="432" width="660" height="30" rx="0"/>
<text class="s" x="40" y="452" style="font-family:monospace">udp</text>
<text class="s" x="130" y="452">(sin estado TCP)</text>
<text class="s" x="280" y="452" style="font-family:monospace">10.0.2.15</text>
<text class="s" x="420" y="452" style="font-family:monospace">192.0.2.53</text>
<text class="s" x="560" y="452" style="font-family:monospace">46401 → 53</text>
<text class="s" x="360" y="486" text-anchor="middle">TIME_WAIT: la conexión se está cerrando. UDP no tiene conexión, pero también se sigue.</text>
</svg>
