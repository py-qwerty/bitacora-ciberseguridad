<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
<defs><marker id="t03fh-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ink" d="M0 0L10 5L0 10z"/></marker><marker id="t03fh-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="bad" d="M0 0L10 5L0 10z"/></marker><marker id="t03fh-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="good" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="h" x="360" y="26" text-anchor="middle">Entrada de cualquier tamaño → huella de tamaño fijo</text>
<rect class="box" x="20" y="60" width="190" height="80" rx="8"/>
<text class="b" x="115" y="96" text-anchor="middle">Entrada</text>
<text class="s" x="115" y="114" text-anchor="middle">longitud arbitraria</text>
<rect class="c4" x="270" y="60" width="180" height="80" rx="8"/>
<text class="b" x="360" y="96" text-anchor="middle">Función hash</text>
<text class="s" x="360" y="114" text-anchor="middle">MD5, SHA-1, SHA-256…</text>
<rect class="c1" x="510" y="60" width="190" height="80" rx="8"/>
<text class="b" x="605" y="96" text-anchor="middle">Salida</text>
<text class="s" x="605" y="114" text-anchor="middle">longitud fija</text>
<text class="h" x="240" y="108" text-anchor="middle">+</text>
<text class="h" x="480" y="108" text-anchor="middle">=</text>
<text class="b" x="20" y="182">Entrada</text>
<text class="b" x="250" y="182">MD5 (128 bits = 32 caracteres hexadecimales)</text>
<rect class="box" x="20" y="200" width="200" height="34" rx="4"/>
<text x="30" y="222" style="font-family:Menlo,Consolas,monospace;font-size:14px">forense</text>
<path class="ln" d="M222 217L244 217" marker-end="url(#t03fh-ink)"/>
<rect class="c1" x="248" y="200" width="452" height="34" rx="4"/>
<text x="260" y="222" style="font-family:Menlo,Consolas,monospace;font-size:14px">e1576f172c3b126ae7a6026e8995da85</text>
<rect class="box" x="20" y="244" width="200" height="34" rx="4"/>
<text x="30" y="266" style="font-family:Menlo,Consolas,monospace;font-size:14px">Forense</text>
<path class="ln" d="M222 261L244 261" marker-end="url(#t03fh-ink)"/>
<rect class="c1" x="248" y="244" width="452" height="34" rx="4"/>
<text x="260" y="266" style="font-family:Menlo,Consolas,monospace;font-size:14px">f0128cf087fa49732bf066306d5f4a6f</text>
<rect class="box" x="20" y="288" width="200" height="34" rx="4"/>
<text x="30" y="310" style="font-family:Menlo,Consolas,monospace;font-size:14px">Un disco de 2 TB…</text>
<path class="ln" d="M222 305L244 305" marker-end="url(#t03fh-ink)"/>
<rect class="tint" x="248" y="288" width="452" height="34" rx="4"/>
<text x="260" y="310" style="font-family:Menlo,Consolas,monospace;font-size:14px">(otros 32 caracteres hex)</text>
<path class="ln" d="M196 228a12 12 0 0 1 0 0"/>
<text class="b" x="360" y="352" text-anchor="middle">Una sola letra distinta (f → F) cambia la huella por completo.</text>
<text class="s" x="360" y="374" text-anchor="middle">La misma entrada da siempre el mismo hash (determinismo).</text>
</svg>
