<text x="152" y="242" font-family="Menlo,Consolas,monospace" style="font-size:15px;font-weight:700">www/</text>
<path class="c4" d="M138 264h11l4 5h17v19h-32z"/>
<text x="178" y="282" font-family="Menlo,Consolas,monospace" style="font-size:15px;font-weight:700">html/</text>
