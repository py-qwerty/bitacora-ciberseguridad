<text class="s" x="415" y="398" text-anchor="middle" style="fill:var(--color-text)">de la cabecera ESP al tráiler</text>
<text x="380" y="490" text-anchor="middle">AH no cifra pero protege también la cabecera IP. ESP cifra, pero su autenticación</text>
<text x="380" y="512" text-anchor="middle"><tspan class="b">no cubre la cabecera IP</tspan> de fuera (en túnel, la interna sí va cifrada dentro).</text>
