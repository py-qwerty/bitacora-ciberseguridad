<text class="s" x="220" y="375" text-anchor="middle">el CRC-32 se sigue calculando</text>
<text class="s" x="220" y="393" text-anchor="middle">por compatibilidad.</text>
<text class="b" x="220" y="450" text-anchor="middle">El IV pasa de 24 a 48 bits y la clave</text>
<text class="b" x="220" y="472" text-anchor="middle">cambia en cada paquete.</text>
