<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330">
<rect class="c1" x="20" y="30" width="220" height="220" rx="12"/>
<text class="b" x="130" y="140" text-anchor="middle">Conocido-</text>
<text class="b" x="130" y="162" text-anchor="middle">conocido</text>
<text class="s" x="130" y="200" text-anchor="middle">lo conocemos bien</text>
<text class="s" x="130" y="284" text-anchor="middle">Ej.: perder un portátil: pasa</text>
<text class="s" x="130" y="302" text-anchor="middle">cada año y sabemos el coste</text>
<rect class="c3" x="260" y="30" width="220" height="220" rx="12"/>
<text class="b" x="370" y="150" text-anchor="middle">Conocido-</text>
<text class="b" x="370" y="172" text-anchor="middle">desconocido</text>
<text class="s" x="370" y="200" text-anchor="middle">sabemos que puede existir</text>
<text class="s" x="370" y="284" text-anchor="middle">Ej.: habrá vulnerabilidades</text>
<text class="s" x="370" y="302" text-anchor="middle">aún no descubiertas</text>
<rect class="ink" x="500" y="30" width="220" height="220" rx="12"/>
<text class="b w" x="610" y="140" text-anchor="middle">Desconocido-</text>
<text class="b w" x="610" y="162" text-anchor="middle">desconocido</text>
<text class="w" x="610" y="200" text-anchor="middle" style="font-size:14px">ni sabemos que existe</text>
<text class="s" x="610" y="284" text-anchor="middle">Ej.: un ataque que nadie</text>
<text class="s" x="610" y="302" text-anchor="middle">había imaginado</text>
<text class="b" x="110" y="90" text-anchor="middle" style="font-size:48px;fill:var(--color-success)">✓</text>
<text class="b" x="370" y="92" text-anchor="middle" style="font-size:48px;fill:var(--color-warning)">?</text>
<text class="b w" x="610" y="92" text-anchor="middle" style="font-size:48px">??</text>
<text class="b" x="370" y="326" text-anchor="middle" style="font-size:14px">Al identificar hay que contar también con lo desconocido.</text>
</svg>
